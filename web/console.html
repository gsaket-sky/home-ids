<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home-IDS Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#12141a; --bg-panel:#181b22; --bg-elevated:#1f232c; --bg-hover:#232833;
    --border:#2a2f3b; --border-soft:#22262f;
    --text:#e7e9ee; --text-dim:#a2a9b8; --text-faint:#6b7280;
    --accent:#22c7e0; --accent-dim:#1a4d57;
    --sev-benign:#3fbf7f; --sev-anomalous:#5aa7f0; --sev-suspicious:#e0b23f; --sev-high:#e0813f; --sev-critical:#e0523f;
    --danger-bg:#2a1d18; --danger-border:#5a3a26;
    --font-sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:5px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);}
  a{color:var(--accent);text-decoration:none;} a:hover{color:#6fdcee;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-panel);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
  #app{display:flex;width:100%;height:100vh;background:var(--bg);overflow:hidden;}
  button, select, input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .sidebar{width:216px;flex:0 0 216px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--border-soft);}
  .brand-name{font-size:14px;font-weight:600;letter-spacing:.02em;}
  .brand-sub{font-size:11px;color:var(--text-faint);margin-top:2px;font-family:var(--font-mono);}
  .nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);font-size:13px;color:var(--text-dim);cursor:pointer;border:1px solid transparent;}
  .nav-item:hover{background:var(--bg-hover);color:var(--text);}
  .nav-item.active{background:var(--bg-elevated);color:var(--text);border-color:var(--border);}
  .nav-item.active svg{color:var(--accent);}
  .nav-item svg{width:16px;height:16px;flex:0 0 16px;color:var(--text-faint);}
  .sidebar-foot{padding:12px 16px 16px;border-top:1px solid var(--border-soft);}
  .status-row{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--sev-benign);flex:0 0 6px;box-shadow:0 0 0 3px rgba(63,191,127,.15);}
  .status-line2{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);margin-top:4px;padding-left:14px;}
  .status-line2.link{cursor:pointer;text-decoration:underline;}

  .main-panel{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
  .topbar{padding:18px 28px 14px;border-bottom:1px solid var(--border-soft);flex:0 0 auto;}
  .topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .view-title{font-size:17px;font-weight:600;}
  .view-sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;max-width:640px;line-height:1.5;}
  .content{flex:1;overflow-y:auto;padding:20px 28px 40px;}


  .input, .select{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);font-size:12.5px;border-radius:var(--radius);padding:7px 10px;outline:none;}
  .input:focus,.select:focus{border-color:var(--accent);}
  .mono{font-family:var(--font-mono);}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-weight:500;border-radius:var(--radius);padding:7px 12px;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--bg-hover);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#08272c;}
  .btn-primary:hover{background:#3ed4ec;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);padding:6px 8px;}
  .btn-ghost:hover{background:var(--bg-hover);color:var(--text);}
  .btn-sm{padding:5px 9px;font-size:11.5px;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-faint);cursor:pointer;}
  .icon-btn:hover{color:var(--text);background:var(--bg-hover);}
  .icon-btn svg{width:13px;height:13px;}
  .icon-btn:disabled, .input:disabled, .select:disabled{opacity:.5;cursor:not-allowed;}

  .badge{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:3px;border:1px solid var(--border);color:var(--text-faint);}
  .badge-live{color:var(--sev-benign);border-color:rgba(63,191,127,.35);background:rgba(63,191,127,.08);}
  .badge-restart{color:var(--sev-suspicious);border-color:rgba(224,178,63,.35);background:rgba(224,178,63,.08);}
  .badge-pending{color:var(--accent);border-color:var(--accent-dim);}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:11px;border:1px solid;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:11px;}
  .chip button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:11px;padding:0;line-height:1;}
  .chip button:hover{color:var(--sev-critical);}
  .tag{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);border:1px solid var(--border);padding:1px 5px;border-radius:3px;}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}

  .panel{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;}
  .panel-header{padding:12px 16px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .panel-title{font-size:12.5px;font-weight:600;}
  .panel-body{padding:14px 16px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border-soft);cursor:pointer;white-space:nowrap;}
  th:hover{color:var(--text-dim);}
  td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-clickable{cursor:pointer;}
  tr.row-clickable:hover td{background:var(--bg-hover);}
  .cell-mono{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .cell-title{font-weight:500;}
  .table-wrap{overflow-x:auto;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .row{display:flex;align-items:center;}
  .toggle{width:34px;height:19px;border-radius:10px;border:1px solid var(--border);position:relative;cursor:pointer;flex:0 0 34px;}
  .toggle-knob{position:absolute;top:2px;width:13px;height:13px;border-radius:50%;transition:left .12s;}

  .kv-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-key{width:170px;flex:0 0 170px;color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;padding-top:2px;}
  .kv-val{flex:1;min-width:0;}

  .config-body{display:flex;height:100%;}
  .section-nav{width:190px;flex:0 0 190px;border-right:1px solid var(--border-soft);padding:10px;overflow-y:auto;}
  .section-item{padding:8px 10px;font-size:12px;border-radius:var(--radius);color:var(--text-dim);cursor:pointer;margin-bottom:1px;}
  .section-item:hover{background:var(--bg-hover);}
  .section-item.active{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);}
  .section-item.danger{color:var(--sev-high);}
  .config-scroll{flex:1;overflow-y:auto;padding:18px 24px;}

  .config-row{padding:13px 0;border-bottom:1px solid var(--border-soft);display:flex;gap:18px;}
  .config-row:last-child{border-bottom:none;}
  .config-key-col{width:300px;flex:0 0 300px;min-width:0;}
  .config-key{font-family:var(--font-mono);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .config-desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;margin-top:4px;}
  .config-val-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .config-default{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);display:flex;align-items:center;gap:6px;}
  .modified-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px;}

  .danger-banner{background:var(--danger-bg);border:1px solid var(--danger-border);color:#e0a582;font-size:11.5px;padding:10px 14px;border-radius:6px;margin-bottom:16px;line-height:1.5;}
  .error-banner{background:var(--danger-bg);border:1px solid var(--danger-border);color:#e0a582;font-size:12.5px;padding:12px 16px;border-radius:6px;margin-bottom:16px;line-height:1.6;}
  .error-banner button{margin-top:8px;}

  .timeline{position:relative;padding-left:22px;}
  .timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--border);}
  .tl-item{position:relative;margin-bottom:12px;}
  .tl-item:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bg-panel);border:2px solid var(--accent);}
  .tl-card{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;padding:11px 13px;}
  .tl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .tl-type{font-size:12px;font-weight:600;}
  .tl-time{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .tl-body{font-size:12px;color:var(--text-dim);line-height:1.5;}

  .mode-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .mode-tab{padding:8px 14px;font-size:12.5px;font-weight:500;border-radius:6px;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;background:var(--bg-elevated);}
  .mode-tab.active{color:var(--text);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}

  .empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;}

  .graph-wrap{display:flex;height:600px;gap:16px;}
  .graph-canvas{flex:1;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;position:relative;overflow:hidden;}
  .graph-legend{position:absolute;top:12px;left:12px;background:rgba(24,27,34,.9);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:11px;display:flex;flex-direction:column;gap:6px;z-index:2;}
  .legend-row{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .legend-check{width:12px;height:12px;border-radius:3px;border:1px solid var(--border);flex:0 0 12px;}
  .graph-drawer{width:280px;flex:0 0 280px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;padding:16px;overflow-y:auto;}
  .node-label{font-size:9.5px;fill:var(--text-dim);font-family:var(--font-sans);}
  .node-sub{font-size:8.5px;fill:var(--text-faint);font-family:var(--font-mono);}

  .search-wrap{position:relative;flex:0 0 auto;}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text-faint);pointer-events:none;}
  .search-input{padding-left:28px;width:220px;}

  /* ---- toasts ---- */
  .toast-stack{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:360px;}
  .toast{padding:10px 14px;border-radius:6px;font-size:12.5px;line-height:1.5;border:1px solid;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .toast-success{background:rgba(63,191,127,.14);border-color:rgba(63,191,127,.4);color:#bdf0d4;}
  .toast-error{background:var(--danger-bg);border-color:var(--danger-border);color:#e0a582;}

  /* ---- staged-edit save bar ---- */
  .save-bar{position:sticky;bottom:0;left:0;right:0;background:var(--bg-elevated);border-top:1px solid var(--accent-dim);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5;}
  .save-bar span{font-size:12px;color:var(--text-dim);}
  .pending-dot{width:6px;height:6px;border-radius:50%;background:var(--sev-suspicious);flex:0 0 6px;display:inline-block;margin-left:6px;}

  /* ---- containment / blocking ---- */
  .containment-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid;white-space:nowrap;}
  .containment-none{color:var(--text-faint);border-color:var(--border);}
  .containment-active{color:var(--sev-critical);border-color:rgba(224,82,63,.4);background:rgba(224,82,63,.1);}
  .action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .btn-danger{border-color:rgba(224,82,63,.45);color:#e0a58a;}
  .btn-danger:hover{background:rgba(224,82,63,.12);}

  /* ---- evidence graph: pan/zoom/drag ---- */
  .graph-canvas{cursor:grab;}
  .graph-canvas.panning{cursor:grabbing;}
  .graph-canvas svg g.node-group{cursor:pointer;}
  .graph-canvas svg g.node-group.dragging{cursor:grabbing;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= constant data (sample, non-config tabs) ============================= */

var SEV_HEX = { BENIGN:'#3fbf7f', ANOMALOUS:'#5aa7f0', SUSPICIOUS:'#e0b23f', HIGH:'#e0813f', CRITICAL:'#e0523f', UNKNOWN:'#6b7280' };
function sevColor(s){ return SEV_HEX[s] || SEV_HEX.UNKNOWN; }
function hexA(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function sevBorder(s){ return hexA(sevColor(s), 0.45); }
function sevBg(s){ return hexA(sevColor(s), 0.12); }
function tierColor(t){
  if (t === 'known-safe') return SEV_HEX.BENIGN;
  if (t === 'suspicious') return SEV_HEX.SUSPICIOUS;
  if (t === 'malicious') return SEV_HEX.CRITICAL;
  return '#6b7280';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var _toastId = 0;
function showToast(kind, message, ms){
  var id = ++_toastId;
  state.toasts.push({ id: id, kind: kind, message: message });
  render();
  setTimeout(function(){
    state.toasts = state.toasts.filter(function(t){ return t.id !== id; });
    render();
  }, ms || 5000);
}
function renderToasts(){
  if (!state.toasts.length) return '';
  return '<div class="toast-stack">' + state.toasts.map(function(t){
    return '<div class="toast toast-'+(t.kind==='error'?'error':'success')+'">'+esc(t.message)+'</div>';
  }).join('') + '</div>';
}
function sevPill(state){
  return '<span class="pill" style="color:'+sevColor(state)+';border-color:'+sevBorder(state)+';background:'+sevBg(state)+'">'
    + '<span class="dot" style="background:'+sevColor(state)+'"></span>'+state+'</span>';
}

var FALLBACK_DEVICE_TYPES = ['laptop','desktop','phone','tablet','smart_tv','gaming_console','printer','nas','iot','camera','server','unknown','dns_server','router','gateway'];

var GRAPH_LEGEND_DEFS = [
  { kind:'device', label:'Device', color:'#5aa7f0', bg:'rgba(90,167,240,.3)' },
  { kind:'evidence', label:'Evidence', color:'#8b93a3', bg:'rgba(139,147,163,.25)' },
  { kind:'destination', label:'Destination', color:'#9e6ee0', bg:'rgba(158,110,224,.3)' },
  { kind:'decision', label:'Decision', color:'#e0b23f', bg:'rgba(224,178,63,.3)' }
];

var ICONS = {
  devices:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20h8M12 16v4"></path></svg>',
  hunt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-5.5-5.5"></path></svg>',
  graph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="2.4"></circle><circle cx="18" cy="6" r="2.4"></circle><circle cx="12" cy="18" r="2.4"></circle><path d="M8 7.3L11 16M16 7.3L13 16M8.4 6h7.2"></path></svg>',
  config:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 13.5a7.4 7.4 0 000-3l1.9-1.4-2-3.4-2.2.9a7.6 7.6 0 00-2.6-1.5L14.1 3h-4l-.4 2.1a7.6 7.6 0 00-2.6 1.5l-2.2-.9-2 3.4L4.6 10.5a7.4 7.4 0 000 3L2.7 15l2 3.4 2.2-.9c.75.65 1.63 1.16 2.6 1.5L10 22h4l.4-2.1a7.6 7.6 0 002.6-1.5l2.2.9 2-3.4z"></path></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-5.5-5.5"></path></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>',
  blocking:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="10" rx="1.5"></rect><path d="M8 10V7a4 4 0 018 0v3"></path></svg>',
  suricata:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 12L18 8M12 3.5v3M12 20.5v-3M3.5 12h3M20.5 12h-3"></path></svg>'
};

/* ============================= mutable state ============================= */

var state = {
  activeView: 'devices',
  selectedDeviceId: null,
  deviceSearch: '',
  sort: {
    devices: { field: 'last_seen', dir: 'desc' },
    blockDevices: { field: 'hostname', dir: 'asc' },
    blockDomains: { field: 'blocked_at', dir: 'desc' },
    suricata: { field: 'timestamp', dir: 'desc' }
  },

  toasts: [],

  devicesLoading: false, devicesLoaded: false, devicesLoadError: null, devices: [],
  deviceDetailLoading: false, deviceDetailError: null, deviceDetail: null,
  deviceActionBusy: null, // set to an action name while an isolate/tarpit/release/block call is in flight

  topDomainsLoading: false, topDomainsLoaded: false, topDomainsError: null, topDomains: null,
  newDeviceBlockDomain: '',

  blockingLoading: false, blockingLoaded: false, blockingLoadError: null, blockingState: null,
  newBlockDomain: '', newBlockDeviceId: '', newBlockReason: '',

  suricataLoading: false, suricataLoaded: false, suricataLoadError: null, suricataDetections: [], suricataNote: '',

  huntMode: 'touching',
  huntDest: '',
  huntDecisionId: '',
  huntDeviceId: '',
  huntSinceDays: '',
  huntRan: false,
  huntLoading: false, huntError: null, huntResult: null,

  graphLoading: false, graphLoaded: false, graphLoadError: null,
  graphNodes: [], graphEdges: [],
  graphSelected: null,
  graphShow: { device:true, evidence:true, destination:true, decision:true },
  graphPan: { x: 0, y: 0 }, graphZoom: 1,
  graphFitPending: false,
  graphMultiSelected: {}, // {nodeId: true} -- nodes selected as a group; dragging any one of them moves the whole set
  graphDrag: null, // {kind:'node', id, dx, dy} or {kind:'pan', startX, startY, panX0, panY0} while a pointer drag is in progress

  // --- real, server-backed config state ---
  configSection: null,        // set once rows load, to the first section
  configSearch: '',
  configRows: [],             // as returned by GET /api/config: {section,key,type,description,suggested_default,options,value,restart_required,editable,overridden,baseline,set_by,set_at}
  deviceTypeOverrides: [],    // [{pattern, type}]
  deviceTypes: FALLBACK_DEVICE_TYPES,
  configLoading: false,
  configLoaded: false,
  configLoadError: null,
  newOverridePattern: '',
  newOverrideType: 'iot',

  // --- staged edits: nothing PATCHes until Save is clicked ---
  pendingConfigEdits: {},     // {key: newValue}
  configSaving: false,
  pendingOverrideEdits: {},   // {pattern: newType} -- existing-row edits awaiting save
  pendingOverrideRemovals: {}, // {pattern: true}
  pendingNewOverrides: [],    // [{pattern, type}] staged via "+ Add override" until saved
  overridesSaving: false,

function getToken(){ return localStorage.getItem('idsApiToken') || ''; }
function setToken(t){ if (t) localStorage.setItem('idsApiToken', t); else localStorage.removeItem('idsApiToken'); }

async function apiFetch(path, options){
  options = options || {};
  var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  var token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  var resp = await fetch(path, Object.assign({}, options, { headers: headers }));
  if (resp.status === 403) {
    var entered = window.prompt('This server requires an API token for requests from another device (the same fritz_api_token / API_SECRET_TOKEN your Fritz!Box/Pi-hole integrations already use). Enter it once — it is remembered in this browser only:');
    if (entered) {
      setToken(entered.trim());
      headers['Authorization'] = 'Bearer ' + entered.trim();
      resp = await fetch(path, Object.assign({}, options, { headers: headers }));
    }
  }
  if (!resp.ok) {
    var detail = '';
    try { var body = await resp.json(); detail = body.detail || JSON.stringify(body); } catch (e) { detail = resp.statusText; }
    throw new Error('HTTP ' + resp.status + ': ' + detail);
  }
  return resp.json();
}

// Strict columnar layout: one fixed x per node kind, stacked top-to-bottom with a
// guaranteed minimum gap so nodes never overlap regardless of graph size. Replaces
// an earlier force-directed relaxation (mutual repulsion + edge springs + a weak
// pull back toward the column) that was meant to declutter the graph organically,
// but let x drift nodes across column boundaries and let y collide within a
// column on any but the smallest graphs -- exactly the "everything is just
// overlapped" complaint this replaces. Ordering within each column is not
// arbitrary: devices sort alphabetically (the "spine" every other column aligns
// to), and evidence/decisions sort by their OWN device's position in that spine
// first, then newest-first -- so a device's evidence and decisions land on
// nearby rows instead of scattered across the whole column, keeping edges short
// and mostly horizontal instead of criss-crossing the whole canvas.
function computeGraphLayout(nodes, edges){
  var colX = { device: 110, evidence: 460, destination: 980, decision: 1400 };
  var radius = { decision: 11, device: 12, destination: 10, evidence: 7 };
  // Minimum gap between adjacent circle EDGES in the same column (not centers) --
  // sized to clear the two-line label ("type" + "sub", drawn beside the node, see
  // renderGraphView) so labels don't overlap between one row and the next even
  // when node radius alone wouldn't need that much room. Evidence rows can run
  // into the hundreds, so they're deliberately the tightest packing.
  var minGap = { decision: 22, device: 22, destination: 22, evidence: 14 };

  var byKind = { device: [], evidence: [], destination: [], decision: [] };
  nodes.forEach(function(n){ (byKind[n.kind] || (byKind[n.kind] = [])).push(n); });

  byKind.device.sort(function(a,b){ return (a.label||'').localeCompare(b.label||''); });
  var deviceOrder = {};
  byKind.device.forEach(function(d, i){ deviceOrder[d.sub || d.id] = i; }); // device node's own id lives in .sub

  if (byKind.destination) byKind.destination.sort(function(a,b){ return (a.label||'').localeCompare(b.label||''); });

  function byDeviceThenRecency(a, b){
    var da = deviceOrder[a.device_id] != null ? deviceOrder[a.device_id] : 999999;
    var db = deviceOrder[b.device_id] != null ? deviceOrder[b.device_id] : 999999;
    if (da !== db) return da - db;
    return (b.timestamp||0) - (a.timestamp||0);
  }
  if (byKind.evidence) byKind.evidence.sort(byDeviceThenRecency);
  if (byKind.decision) byKind.decision.sort(byDeviceThenRecency);

  var byId = {};
  var laidOut = [];
  Object.keys(colX).forEach(function(kind){
    var seedX = colX[kind];
    var r = radius[kind] || 9;
    var rowH = r*2 + (minGap[kind] || 18);
    var y = 40;
    (byKind[kind] || []).forEach(function(n){
      y += rowH/2;
      var out = Object.assign({}, n, { x: seedX, y: y, r: r });
      if (n.kind === 'decision') { out.fill = hexA(sevColor(n.label), 0.85); out.stroke = sevColor(n.label); }
      else if (n.kind === 'device') { out.fill = 'rgba(90,167,240,.3)'; out.stroke = '#5aa7f0'; }
      else if (n.kind === 'destination') { out.fill = 'rgba(155,110,224,.25)'; out.stroke = '#9e6ee0'; }
      else { out.fill = 'rgba(226,229,235,.18)'; out.stroke = '#8b93a3'; }
      byId[n.id] = out;
      laidOut.push(out);
      y += rowH/2;
    });
  });

  var laidOutEdges = edges.map(function(e){
    var relColor = { observed:'#4a5568', targets:'#5a6478', supports:'#22c7e0', contradicts:'#e0523f' };
    return Object.assign({}, e, { stroke: relColor[e.relation] || '#6b7280', dash: e.relation==='contradicts' ? '4,3' : '' });
  });

  return { nodes: laidOut, edges: laidOutEdges, byId: byId };
}

/* ============================= generic table sorting (every table, every column) ============================= */

function sortRows(rows, sort, getters){
  var field = sort.field, dir = sort.dir === 'asc' ? 1 : -1;
  var getter = (getters && getters[field]) || function(r){ return r[field]; };
  var copy = rows.slice();
  copy.sort(function(a,b){
    var av = getter(a), bv = getter(b);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string' && typeof bv === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return -1*dir;
    if (av > bv) return 1*dir;
    return 0;
  });
  return copy;
}
function sortArrow(table, field){
  var s = state.sort[table];
  return s.field===field ? (s.dir==='asc' ? ' ▲' : ' ▼') : '';
}
function sortableTh(table, field, label, extraAttrs){
  return '<th'+(extraAttrs||'')+' onclick="app.toggleSort(\''+table+'\',\''+field+'\')">'+label+sortArrow(table, field)+'</th>';
}

    + '<div class="action-row">'
    + '<button class="btn btn-danger btn-sm" '+(busy?'disabled':'')+' onclick="app.isolateRouter(\''+d.device_id+'\', \''+esc(d.hostname)+'\')">Isolate via Fritz!Box</button>'
    + '<button class="btn btn-danger btn-sm" '+(busy?'disabled':'')+' onclick="app.tarpitDevice(\''+d.device_id+'\', \''+esc(d.hostname)+'\')">Tarpit (Layer-2)</button>'
    + '<button class="btn btn-sm" '+(busy?'disabled':'')+' onclick="app.releaseDevice(\''+d.device_id+'\', \''+esc(d.hostname)+'\')">Release everything</button>'
    + '</div>'

    + '<div class="row" style="gap:8px;margin-top:12px;">'
    + '<input class="input mono" style="flex:1;" placeholder="domain to block for this device" value="'+esc(state.newDeviceBlockDomain)+'" onchange="app.onNewDeviceBlockDomain(this.value)">'

    + '</div></div></div>'

    + '<div class="panel-body">'+topDomainsHtml+'</div>'
    + '</div></div>';
}

function renderHuntView(){
  var modeDefs = [['touching','Devices touching X'],['timeline','Decision timeline'],['history','Device history'],['replay','Replay decision']];
  var tabs = modeDefs.map(function(m){
    return '<div class="mode-tab'+(state.huntMode===m[0]?' active':'')+'" onclick="app.goHuntMode(\''+m[0]+'\')">'+m[1]+'</div>';
  }).join('');

  var deviceOpts = '<option value="">— select a device —</option>' + state.devices.map(function(d){
    return '<option value="'+d.device_id+'"'+(d.device_id===state.huntDeviceId?' selected':'')+'>'+esc(d.hostname)+'</option>';
  }).join('');

  var formHtml = '';
  if (state.huntMode==='touching') {
    formHtml = '<div class="row" style="gap:10px;"><span style="font-size:12px;color:var(--text-dim);">devices_touching(</span>'
      + '<input class="input mono" style="flex:1;" placeholder="destination — domain or IP substring, e.g. 203.0.113" value="'+esc(state.huntDest)+'" onchange="app.onHuntDest(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">, since_days=</span>'
      + '<input class="input mono" style="width:70px;" placeholder="all" value="'+esc(state.huntSinceDays)+'" onchange="app.onHuntSinceDays(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">)</span><button class="btn btn-primary" onclick="app.runHuntQuery()">Run</button></div>';
  } else if (state.huntMode==='timeline') {
    formHtml = '<div class="row" style="gap:10px;"><span style="font-size:12px;color:var(--text-dim);">decision_timeline(</span>'
      + '<input class="input mono" style="flex:1;" placeholder="decision_id — from the Evidence Graph tab or a device\'s history" value="'+esc(state.huntDecisionId)+'" onchange="app.onHuntDecisionInput(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">)</span><button class="btn btn-primary" onclick="app.runHuntQuery()">Run</button></div>';
  } else if (state.huntMode==='history') {
    formHtml = '<div class="row" style="gap:10px;"><span style="font-size:12px;color:var(--text-dim);">device_history(</span>'
      + '<select class="select mono" style="flex:1;" onchange="app.onHuntDevice(this.value)">'+deviceOpts+'</select>'
      + '<span style="font-size:12px;color:var(--text-dim);">, since_days=</span>'
      + '<input class="input mono" style="width:70px;" placeholder="all" value="'+esc(state.huntSinceDays)+'" onchange="app.onHuntSinceDays(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">)</span><button class="btn btn-primary" onclick="app.runHuntQuery()">Run</button></div>';
  } else {
    formHtml = '<div class="row" style="gap:10px;"><span style="font-size:12px;color:var(--text-dim);">replay_decision(</span>'
      + '<input class="input mono" style="flex:1;" placeholder="decision_id" value="'+esc(state.huntDecisionId)+'" onchange="app.onHuntDecisionInput(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">)</span><button class="btn btn-primary" onclick="app.runHuntQuery()">Replay against current engine</button></div>';
  }

  var resultsHtml = '';
  if (state.huntError) {
    resultsHtml = '<div class="error-banner">'+esc(state.huntError)+'</div>';
  } else if (state.huntLoading) {
    resultsHtml = '<div class="panel"><div class="panel-body"><div class="empty-state">Running query…</div></div></div>';
  } else if (state.huntRan && state.huntResult) {
    var r = state.huntResult;
    var body = '';
    if (state.huntMode==='touching') {
      if (!r.devices.length) {
        body = '<div class="empty-state">No device evidence references "'+esc(r.destination_query)+'"'+(r.matched_destinations.length ? '' : ' — no destination in the graph matches that text at all.')+'</div>';
      } else {
        var trs = r.devices.map(function(dv){
          return '<tr><td><div class="cell-title">'+esc(dv.hostname)+'</div><div class="cell-mono">'+dv.device_id+'</div></td>'
            + '<td><button class="btn btn-ghost btn-sm" onclick="app.selectDevice(\''+dv.device_id+'\')">Open device →</button></td></tr>';
        }).join('');
        body = '<div style="font-size:11.5px;color:var(--text-dim);margin-bottom:10px;">Matched destination(s): '+r.matched_destinations.map(function(x){ return '<span class="tag">'+esc(x)+'</span>'; }).join(' ')+'</div>'
          + '<div class="table-wrap"><table><thead><tr><th>Device</th><th></th></tr></thead><tbody>'+trs+'</tbody></table></div>';
      }
    } else if (state.huntMode==='timeline') {
      var dec = r.decision;
      var items = r.evidence.map(function(e){
        return '<div class="tl-item"><div class="tl-card"><div class="tl-head"><span class="tl-type" title="'+esc(e.evidence_type)+'">'+esc(e.type_label || e.evidence_type)+'</span><span class="tl-time">'+fmtTime(e.timestamp)+'</span></div>'
          + '<div class="tl-body">'+(e.type_description ? esc(e.type_description)+'<br>' : '')+(e.destination_id !== '(none)' ? 'target: '+esc(e.destination_id)+' · ' : '') +'confidence '+e.confidence+' · source '+esc(e.source)+' · family '+esc(e.independence_family)+'</div></div></div>';
      }).join('');
      var decExplanation = dec.explanation_label || (dec.raw_payload && dec.raw_payload.explanation) || '—';
      items += '<div class="tl-item"><div class="tl-card" style="border-color:'+sevColor(dec.state)+';"><div class="tl-head"><span class="tl-type" style="color:'+sevColor(dec.state)+'">DECISION — '+dec.state+'</span><span class="tl-time">'+fmtTime(dec.timestamp)+'</span></div>'
        + '<div class="tl-body">explanation: <b>'+esc(decExplanation)+'</b>'+(dec.explanation_description ? ' — '+esc(dec.explanation_description) : '')+' · confidence '+dec.confidence+' · risk '+dec.risk_score+'<br>decision_path: '+esc(dec.decision_path)+'</div></div></div>';
      body = '<div class="timeline">'+items+'</div>';
    } else if (state.huntMode==='history') {
      var decItems = r.decisions.map(function(d){
        var expl = d.explanation_label || (d.raw_payload && d.raw_payload.explanation) || '';
        return { t:d.timestamp, html:'<div class="tl-item"><div class="tl-card" style="border-color:'+sevBorder(d.state)+';"><div class="tl-head"><span class="tl-type" style="color:'+sevColor(d.state)+'">DECISION — '+d.state+'</span><span class="tl-time">'+fmtTime(d.timestamp)+'</span></div>'
        + '<div class="tl-body">'+(expl ? esc(expl)+' · ' : '')+'confidence '+d.confidence+' · risk '+d.risk_score+' · '+esc(d.decision_path)+'</div></div></div>' }; });
      var evItems = r.evidence.map(function(e){ return { t:e.timestamp, html:'<div class="tl-item"><div class="tl-card"><div class="tl-head"><span class="tl-type" title="'+esc(e.evidence_type)+'">'+esc(e.type_label || e.evidence_type)+'</span><span class="tl-time">'+fmtTime(e.timestamp)+'</span></div>'
        + '<div class="tl-body">'+(e.destination_id !== '(none)' ? 'target: '+esc(e.destination_id)+' · ' : '')+'confidence '+e.confidence+' · source '+esc(e.source)+'</div></div></div>' }; });
      var all = decItems.concat(evItems).sort(function(a,b){ return a.t>b.t?-1:1; }).map(function(x){ return x.html; }).join('');
      body = all ? '<div class="timeline">'+all+'</div>' : '<div class="empty-state">No decisions or evidence for this device in the selected window.</div>';
    } else {
      if (r.outcome === 'no_evidence_available') {
        body = '<div class="empty-state">No supporting evidence available to replay this decision (it predates evidence_ids wiring, or its evidence has aged past retention).</div>';
      } else if (r.outcome === 'replay_error') {
        body = '<div class="error-banner">Replay failed: '+esc(r.error)+'</div>';
      } else {
        var outcomeColor = r.outcome==='changed' ? SEV_HEX.HIGH : SEV_HEX.BENIGN;
        body = '<div class="grid2" style="grid-template-columns:1fr auto 1fr;align-items:center;">'
          + '<div class="panel" style="background:var(--bg-elevated);"><div class="panel-body">'
          + '<div style="font-size:10.5px;color:var(--text-faint);margin-bottom:6px;">ORIGINAL — at decision time</div>'
          + '<div class="pill" style="color:'+sevColor(r.old_state)+';border-color:'+sevBorder(r.old_state)+';background:'+sevBg(r.old_state)+';font-size:14px;padding:6px 12px;">'+r.old_state+'</div>'
          + '<div style="font-size:11.5px;color:var(--text-dim);margin-top:8px;">'+esc(r.old_decision_path)+'</div></div></div>'
          + '<div style="font-size:18px;color:var(--text-faint);">→</div>'
          + '<div class="panel" style="background:var(--bg-elevated);"><div class="panel-body">'
          + '<div style="font-size:10.5px;color:var(--text-faint);margin-bottom:6px;">REPLAYED — against current engine</div>'
          + '<div class="pill" style="color:'+sevColor(r.new_state)+';border-color:'+sevBorder(r.new_state)+';background:'+sevBg(r.new_state)+';font-size:14px;padding:6px 12px;">'+r.new_state+'</div>'
          + '<div style="font-size:11.5px;color:var(--text-dim);margin-top:8px;">'+esc(r.new_decision_path)+'</div></div></div></div>'
          + '<div style="margin-top:14px;padding:10px 13px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;font-size:12px;">'
          + 'outcome: <b style="color:'+outcomeColor+'">'+r.outcome+'</b> — evaluated against '+r.evidence_count+' real evidence item(s)</div>';
      }
    }
    resultsHtml = '<div class="panel"><div class="panel-body">'+body+'</div></div>';
  }

  return ''
    + '<div class="topbar"><div class="view-title">Ad-hoc threat hunt</div><div class="view-sub">Direct structured queries over the evidence graph — not a log grep. Backed by ops/threat_hunt.py and ops/decision_replay.py.</div></div>'
    + '<div class="content"><div class="mode-tabs">'+tabs+'</div><div class="panel" style="margin-bottom:16px;"><div class="panel-body">'+formHtml+'</div></div>'+resultsHtml+'</div>';
}

function renderBlockingView(){
  var topbarHead = '<div class="topbar"><div class="view-title">Blocking</div><div class="view-sub">Everything currently contained by this engine — Fritz!Box WAN isolation, Layer-2 tarpit, and Pi-hole domain blocks — with manual release/unblock, plus a form to block a domain by hand.</div></div>';

    return topbarHead + '<div class="content"><div class="error-banner">Could not load blocking state: '+esc(state.blockingLoadError)+'.<br><button class="btn btn-primary btn-sm" onclick="app.reloadBlocking()">Retry</button></div></div>';
  }

  }
  var b = state.blockingState || { contained_devices: [], blocked_domains: [] };

    hostname: function(cd){ return cd.hostname; },

          + '<td class="cell-mono">'+esc(cd.ip||'—')+'</td><td>'+methods+'</td>'
          + '<td><button class="btn btn-ghost btn-sm" onclick="app.releaseDevice(\''+esc(cd.device_id)+'\', \''+esc(cd.hostname)+'\')">Release</button> '
          + '<button class="btn btn-ghost btn-sm" onclick="app.selectDevice(\''+esc(cd.device_id)+'\')">Open →</button></td></tr>';

  var sortedDomains = sortRows(b.blocked_domains, state.sort.blockDomains, {
    domain: function(dm){ return dm.domain; },

    blocked_at: function(dm){ return dm.blocked_at; },

        return '<tr><td class="cell-mono">'+esc(dm.domain)+'</td><td>'+esc(dm.hostname)+'</td>'
          + '<td style="font-size:11.5px;color:var(--text-dim);">'+esc(dm.reason||'')+'</td><td class="cell-mono">'+fmtTime(dm.blocked_at)+'</td>'
          + '<td><button class="btn btn-ghost btn-sm" onclick="app.unblockDomain(\''+esc(dm.domain)+'\', null)">Unblock</button></td></tr>';
      }).join('')
    : '<tr><td colspan="5"><div class="empty-state">No domains currently blocked.</div></td></tr>';

  var deviceOpts = '<option value="">— none (manual) —</option>' + (state.devices||[]).map(function(dv){
    return '<option value="'+dv.device_id+'"'+(dv.device_id===state.newBlockDeviceId?' selected':'')+'>'+esc(dv.hostname)+'</option>';
  }).join('');

  return topbarHead + '<div class="content">'
    + '<div class="panel" style="margin-bottom:16px;"><div class="panel-header"><div class="panel-title">Contained devices</div></div>'
    + '<div class="table-wrap"><table><thead><tr>'
    + sortableTh('blockDevices','hostname','Device') + sortableTh('blockDevices','ip','IP') + sortableTh('blockDevices','method','Method') + '<th></th>'
    + '</tr></thead><tbody>'+deviceRows+'</tbody></table></div></div>'
    + '<div class="panel"><div class="panel-header"><div class="panel-title">Blocked domains</div></div>'
    + '<div class="table-wrap"><table><thead><tr>'
    + sortableTh('blockDomains','domain','Domain') + sortableTh('blockDomains','hostname','Device') + sortableTh('blockDomains','reason','Reason') + sortableTh('blockDomains','blocked_at','Blocked') + '<th></th>'
    + '</tr></thead><tbody>'+domainRows+'</tbody></table></div>'
    + '<div class="panel-body" style="border-top:1px solid var(--border-soft);"><div class="row" style="gap:8px;flex-wrap:wrap;">'
    + '<input class="input mono" style="flex:1;min-width:180px;" placeholder="domain to block" value="'+esc(state.newBlockDomain)+'" onchange="app.onNewBlockDomain(this.value)">'
    + '<select class="select mono" onchange="app.onNewBlockDeviceId(this.value)">'+deviceOpts+'</select>'

    + '<button class="btn btn-primary" onclick="app.submitBlockDomain()">Block domain</button>'

function renderSuricataView(){
  var topbarHead = '<div class="topbar"><div class="view-title">Suricata</div><div class="view-sub">Recent alerts where a real Suricata IDS rule fired against captured traffic, read from state/alerts.json (Suricata runs as a batch subprocess against reactive-capture pcap bursts, not a continuous stream, and isn\'t wired into the v13 evidence graph yet — see Documentation/CONSOLE_DATA_API.md).</div></div>';

  if (state.suricataLoadError) {
    return topbarHead + '<div class="content"><div class="error-banner">Could not load Suricata detections: '+esc(state.suricataLoadError)+'.<br><button class="btn btn-primary btn-sm" onclick="app.reloadSuricata()">Retry</button></div></div>';
  }
  if (state.suricataLoading && !state.suricataLoaded) {
    return topbarHead + '<div class="content"><div class="empty-state">Scanning the alert log…</div></div>';
  }
  var list = sortRows(state.suricataDetections || [], state.sort.suricata, {
    hostname: function(det){ return det.hostname; },
    timestamp: function(det){ return det.timestamp; },
    target: function(det){ return det.target; },
    rule: function(det){ return det.detail_recorded ? 1 : 0; },
    severity: function(det){ return det.state || det.risk; },
  });
  var rows = list.length
    ? list.map(function(det){
        var detail = det.detail_recorded
          ? det.matches.map(function(m){ return '<div class="cell-mono" style="font-size:11px;">'+esc(m.category)+' — '+esc(m.signature)+'</div>'; }).join('')
          : '<span style="color:var(--text-faint);font-size:11.5px;">signature detail not recorded for this alert</span>';
        return '<tr class="row-clickable" onclick="app.selectDevice(\''+esc(det.device_id)+'\')">'
          + '<td><div class="cell-title">'+esc(det.hostname)+'</div><div class="cell-mono">'+esc(det.device_id)+'</div></td>'
          + '<td class="cell-mono">'+fmtTime(det.timestamp)+'</td>'
          + '<td class="cell-mono">'+esc(det.target||'—')+'</td>'

          + '<td>'+(det.state ? sevPill(det.state) : '<span class="tag">'+esc(String(det.risk||'—'))+'</span>')+'</td>'
          + '</tr>';
      }).join('')
    : '<tr><td colspan="5"><div class="empty-state">No Suricata signature matches found in the scanned window of the alert log.</div></td></tr>';

  return topbarHead + '<div class="content"><div class="panel"><div class="table-wrap"><table><thead><tr>'
    + sortableTh('suricata','hostname','Device') + sortableTh('suricata','timestamp','When') + sortableTh('suricata','target','Target') + sortableTh('suricata','rule','Rule') + sortableTh('suricata','severity','Severity')
    + '</tr></thead><tbody>'+rows+'</tbody></table></div></div>'
    + '<div style="font-size:11px;color:var(--text-faint);margin-top:10px;">'+esc(state.suricataNote||'')+'</div></div>';
