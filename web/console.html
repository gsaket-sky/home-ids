<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home-IDS Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#12141a; --bg-panel:#181b22; --bg-elevated:#1f232c; --bg-hover:#232833;
    --border:#2a2f3b; --border-soft:#22262f;
    --text:#e7e9ee; --text-dim:#a2a9b8; --text-faint:#6b7280;
    --accent:#22c7e0; --accent-dim:#1a4d57;
    --sev-benign:#3fbf7f; --sev-anomalous:#5aa7f0; --sev-suspicious:#e0b23f; --sev-high:#e0813f; --sev-critical:#e0523f;
    --danger-bg:#2a1d18; --danger-border:#5a3a26;
    --font-sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:5px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);}
  a{color:var(--accent);text-decoration:none;} a:hover{color:#6fdcee;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-panel);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
  #app{display:flex;width:100%;height:100vh;background:var(--bg);overflow:hidden;}
  button, select, input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .sidebar{width:216px;flex:0 0 216px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--border-soft);}
  .brand-name{font-size:14px;font-weight:600;letter-spacing:.02em;}
  .brand-sub{font-size:11px;color:var(--text-faint);margin-top:2px;font-family:var(--font-mono);}
  .nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);font-size:13px;color:var(--text-dim);cursor:pointer;border:1px solid transparent;}
  .nav-item:hover{background:var(--bg-hover);color:var(--text);}
  .nav-item.active{background:var(--bg-elevated);color:var(--text);border-color:var(--border);}
  .nav-item.active svg{color:var(--accent);}
  .nav-item svg{width:16px;height:16px;flex:0 0 16px;color:var(--text-faint);}
  .sidebar-foot{padding:12px 16px 16px;border-top:1px solid var(--border-soft);}
  .status-row{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--sev-benign);flex:0 0 6px;box-shadow:0 0 0 3px rgba(63,191,127,.15);}
  .status-line2{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);margin-top:4px;padding-left:14px;}
  .status-line2.link{cursor:pointer;text-decoration:underline;}

  .main-panel{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
  .topbar{padding:18px 28px 14px;border-bottom:1px solid var(--border-soft);flex:0 0 auto;}
  .topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .view-title{font-size:17px;font-weight:600;}
  .view-sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;max-width:640px;line-height:1.5;}
  .content{flex:1;overflow-y:auto;padding:20px 28px 40px;}


  .input, .select{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);font-size:12.5px;border-radius:var(--radius);padding:7px 10px;outline:none;}
  .input:focus,.select:focus{border-color:var(--accent);}
  .mono{font-family:var(--font-mono);}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-weight:500;border-radius:var(--radius);padding:7px 12px;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--bg-hover);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#08272c;}
  .btn-primary:hover{background:#3ed4ec;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);padding:6px 8px;}
  .btn-ghost:hover{background:var(--bg-hover);color:var(--text);}
  .btn-sm{padding:5px 9px;font-size:11.5px;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-faint);cursor:pointer;}
  .icon-btn:hover{color:var(--text);background:var(--bg-hover);}
  .icon-btn svg{width:13px;height:13px;}
  .icon-btn:disabled, .input:disabled, .select:disabled{opacity:.5;cursor:not-allowed;}

  .badge{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:3px;border:1px solid var(--border);color:var(--text-faint);}
  .badge-live{color:var(--sev-benign);border-color:rgba(63,191,127,.35);background:rgba(63,191,127,.08);}
  .badge-restart{color:var(--sev-suspicious);border-color:rgba(224,178,63,.35);background:rgba(224,178,63,.08);}
  .badge-pending{color:var(--accent);border-color:var(--accent-dim);}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:11px;border:1px solid;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:11px;}
  .chip button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:11px;padding:0;line-height:1;}
  .chip button:hover{color:var(--sev-critical);}
  .tag{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);border:1px solid var(--border);padding:1px 5px;border-radius:3px;}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}

  .panel{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;}
  .panel-header{padding:12px 16px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .panel-title{font-size:12.5px;font-weight:600;}
  .panel-body{padding:14px 16px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border-soft);cursor:pointer;white-space:nowrap;}
  th:hover{color:var(--text-dim);}
  td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-clickable{cursor:pointer;}
  tr.row-clickable:hover td{background:var(--bg-hover);}
  .cell-mono{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .cell-title{font-weight:500;}
  .table-wrap{overflow-x:auto;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .row{display:flex;align-items:center;}
  .toggle{width:34px;height:19px;border-radius:10px;border:1px solid var(--border);position:relative;cursor:pointer;flex:0 0 34px;}
  .toggle-knob{position:absolute;top:2px;width:13px;height:13px;border-radius:50%;transition:left .12s;}

  .kv-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-key{width:170px;flex:0 0 170px;color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;padding-top:2px;}
  .kv-val{flex:1;min-width:0;}

  .config-body{display:flex;height:100%;}
  .section-nav{width:190px;flex:0 0 190px;border-right:1px solid var(--border-soft);padding:10px;overflow-y:auto;}
  .section-item{padding:8px 10px;font-size:12px;border-radius:var(--radius);color:var(--text-dim);cursor:pointer;margin-bottom:1px;}
  .section-item:hover{background:var(--bg-hover);}
  .section-item.active{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);}
  .section-item.danger{color:var(--sev-high);}
  .config-scroll{flex:1;overflow-y:auto;padding:18px 24px;}

  .config-row{padding:13px 0;border-bottom:1px solid var(--border-soft);display:flex;gap:18px;}
  .config-row:last-child{border-bottom:none;}
  .config-key-col{width:300px;flex:0 0 300px;min-width:0;}
  .config-key{font-family:var(--font-mono);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .config-desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;margin-top:4px;}
  .config-val-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .config-default{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);display:flex;align-items:center;gap:6px;}
  .modified-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px;}

  .danger-banner{background:var(--danger-bg);border:1px solid var(--danger-border);color:#e0a582;font-size:11.5px;padding:10px 14px;border-radius:6px;margin-bottom:16px;line-height:1.5;}
  .error-banner{background:var(--danger-bg);border:1px solid var(--danger-border);color:#e0a582;font-size:12.5px;padding:12px 16px;border-radius:6px;margin-bottom:16px;line-height:1.6;}
  .error-banner button{margin-top:8px;}

  .timeline{position:relative;padding-left:22px;}
  .timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--border);}
  .tl-item{position:relative;margin-bottom:12px;}
  .tl-item:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bg-panel);border:2px solid var(--accent);}
  .tl-card{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;padding:11px 13px;}
  .tl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .tl-type{font-size:12px;font-weight:600;}
  .tl-time{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .tl-body{font-size:12px;color:var(--text-dim);line-height:1.5;}

  .mode-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .mode-tab{padding:8px 14px;font-size:12.5px;font-weight:500;border-radius:6px;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;background:var(--bg-elevated);}
  .mode-tab.active{color:var(--text);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}

  .empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;}

  .graph-wrap{display:flex;height:600px;gap:16px;}
  .graph-canvas{flex:1;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;position:relative;overflow:auto;}
  .graph-legend{position:absolute;top:12px;left:12px;background:rgba(24,27,34,.9);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:11px;display:flex;flex-direction:column;gap:6px;z-index:2;}
  .legend-row{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .legend-check{width:12px;height:12px;border-radius:3px;border:1px solid var(--border);flex:0 0 12px;}
  .graph-drawer{width:280px;flex:0 0 280px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;padding:16px;overflow-y:auto;}
  .node-label{font-size:9.5px;fill:var(--text-dim);font-family:var(--font-sans);}
  .node-sub{font-size:8.5px;fill:var(--text-faint);font-family:var(--font-mono);}

  .search-wrap{position:relative;flex:0 0 auto;}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text-faint);pointer-events:none;}
  .search-input{padding-left:28px;width:220px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= constant data (sample, non-config tabs) ============================= */

var SEV_HEX = { BENIGN:'#3fbf7f', ANOMALOUS:'#5aa7f0', SUSPICIOUS:'#e0b23f', HIGH:'#e0813f', CRITICAL:'#e0523f', UNKNOWN:'#6b7280' };
function sevColor(s){ return SEV_HEX[s] || SEV_HEX.UNKNOWN; }
function hexA(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function sevBorder(s){ return hexA(sevColor(s), 0.45); }
function sevBg(s){ return hexA(sevColor(s), 0.12); }
function tierColor(t){
  if (t === 'known-safe') return SEV_HEX.BENIGN;
  if (t === 'suspicious') return SEV_HEX.SUSPICIOUS;
  if (t === 'malicious') return SEV_HEX.CRITICAL;
  return '#6b7280';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sevPill(state){
  return '<span class="pill" style="color:'+sevColor(state)+';border-color:'+sevBorder(state)+';background:'+sevBg(state)+'">'
    + '<span class="dot" style="background:'+sevColor(state)+'"></span>'+state+'</span>';
}

var FALLBACK_DEVICE_TYPES = ['laptop','desktop','phone','tablet','smart_tv','gaming_console','printer','nas','iot','camera','server','unknown','dns_server','router','gateway'];

var GRAPH_LEGEND_DEFS = [
  { kind:'device', label:'Device', color:'#5aa7f0', bg:'rgba(90,167,240,.3)' },
  { kind:'evidence', label:'Evidence', color:'#8b93a3', bg:'rgba(139,147,163,.25)' },
  { kind:'destination', label:'Destination', color:'#9e6ee0', bg:'rgba(158,110,224,.3)' },
  { kind:'decision', label:'Decision', color:'#e0b23f', bg:'rgba(224,178,63,.3)' }
];

var ICONS = {
  devices:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20h8M12 16v4"></path></svg>',
  hunt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-5.5-5.5"></path></svg>',
  graph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="2.4"></circle><circle cx="18" cy="6" r="2.4"></circle><circle cx="12" cy="18" r="2.4"></circle><path d="M8 7.3L11 16M16 7.3L13 16M8.4 6h7.2"></path></svg>',
  config:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 13.5a7.4 7.4 0 000-3l1.9-1.4-2-3.4-2.2.9a7.6 7.6 0 00-2.6-1.5L14.1 3h-4l-.4 2.1a7.6 7.6 0 00-2.6 1.5l-2.2-.9-2 3.4L4.6 10.5a7.4 7.4 0 000 3L2.7 15l2 3.4 2.2-.9c.75.65 1.63 1.16 2.6 1.5L10 22h4l.4-2.1a7.6 7.6 0 002.6-1.5l2.2.9 2-3.4z"></path></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-5.5-5.5"></path></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>'
};

/* ============================= mutable state ============================= */

var state = {
  activeView: 'devices',
  selectedDeviceId: null,
  deviceSearch: '',
  sortField: 'last_seen',
  sortDir: 'desc',

  devicesLoading: false, devicesLoaded: false, devicesLoadError: null, devices: [],
  deviceDetailLoading: false, deviceDetailError: null, deviceDetail: null,

  huntMode: 'touching',
  huntDest: '',
  huntDecisionId: '',
  huntDeviceId: '',
  huntSinceDays: '',
  huntRan: false,
  huntLoading: false, huntError: null, huntResult: null,

  graphLoading: false, graphLoaded: false, graphLoadError: null,
  graphNodes: [], graphEdges: [],
  graphSelected: null,
  graphShow: { device:true, evidence:true, destination:true, decision:true },

  // --- real, server-backed config state ---
  configSection: null,        // set once rows load, to the first section
  configSearch: '',
  configRows: [],             // as returned by GET /api/config: {section,key,type,description,suggested_default,options,value,restart_required,editable,overridden,baseline,set_by,set_at}
  deviceTypeOverrides: [],    // [{pattern, type}]
  deviceTypes: FALLBACK_DEVICE_TYPES,
  configLoading: false,
  configLoaded: false,
  configLoadError: null,
  newOverridePattern: '',
  newOverrideType: 'iot'
};

/* ============================= config API client ============================= */

function getToken(){ return localStorage.getItem('idsApiToken') || ''; }
function setToken(t){ if (t) localStorage.setItem('idsApiToken', t); else localStorage.removeItem('idsApiToken'); }

async function apiFetch(path, options){
  options = options || {};
  var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  var token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  var resp = await fetch(path, Object.assign({}, options, { headers: headers }));
  if (resp.status === 403) {
    var entered = window.prompt('This server requires an API token for requests from another device (the same fritz_api_token / API_SECRET_TOKEN your Fritz!Box/Pi-hole integrations already use). Enter it once — it is remembered in this browser only:');
    if (entered) {
      setToken(entered.trim());
      headers['Authorization'] = 'Bearer ' + entered.trim();
      resp = await fetch(path, Object.assign({}, options, { headers: headers }));
    }
  }
  if (!resp.ok) {
    var detail = '';
    try { var body = await resp.json(); detail = body.detail || JSON.stringify(body); } catch (e) { detail = resp.statusText; }
    throw new Error('HTTP ' + resp.status + ': ' + detail);
  }
  return resp.json();
}

async function loadDevices(){
  state.devicesLoading = true; state.devicesLoadError = null; render();
  try {
    var data = await apiFetch('/api/devices');
    state.devices = data.devices;
    state.devicesLoaded = true;
  } catch (err) {
    state.devicesLoadError = err.message || String(err);
  } finally {
    state.devicesLoading = false; render();
  }
}

async function loadDeviceDetail(deviceId){
  state.deviceDetailLoading = true; state.deviceDetailError = null; state.deviceDetail = null; render();
  try {
    state.deviceDetail = await apiFetch('/api/devices/' + encodeURIComponent(deviceId));
  } catch (err) {
    state.deviceDetailError = err.message || String(err);
  } finally {
    state.deviceDetailLoading = false; render();
  }
}

async function runHuntQuery(){
  state.huntLoading = true; state.huntError = null; state.huntResult = null; render();
  try {
    var mode = state.huntMode;
    if (mode === 'touching') {
      var qs = '?destination=' + encodeURIComponent(state.huntDest) + (state.huntSinceDays ? '&since_days=' + encodeURIComponent(state.huntSinceDays) : '');
      state.huntResult = await apiFetch('/api/hunt/devices_touching' + qs);
    } else if (mode === 'timeline') {
      state.huntResult = await apiFetch('/api/hunt/decision_timeline/' + encodeURIComponent(state.huntDecisionId));
    } else if (mode === 'history') {
      var qs2 = state.huntSinceDays ? '?since_days=' + encodeURIComponent(state.huntSinceDays) : '';
      state.huntResult = await apiFetch('/api/hunt/device_history/' + encodeURIComponent(state.huntDeviceId) + qs2);
    } else {
      state.huntResult = await apiFetch('/api/hunt/replay/' + encodeURIComponent(state.huntDecisionId), { method: 'POST' });
    }
  } catch (err) {
    state.huntError = err.message || String(err);
  } finally {
    state.huntLoading = false; state.huntRan = true; render();
  }
}

function computeGraphLayout(nodes, edges){
  var order = ['device', 'evidence', 'destination', 'decision'];
  var colX = { device: 90, evidence: 340, destination: 660, decision: 900 };
  var counters = { device: 0, evidence: 0, destination: 0, decision: 0 };
  var byId = {};
  var laidOut = nodes.map(function(n){
    var i = counters[n.kind] || 0;
    counters[n.kind] = i + 1;
    var spacing = n.kind === 'evidence' ? 34 : 70;
    var out = Object.assign({}, n, {
      x: colX[n.kind] != null ? colX[n.kind] : 500,
      y: 50 + i * spacing,
      r: n.kind === 'decision' ? 11 : (n.kind === 'device' ? 12 : (n.kind === 'destination' ? 10 : 7)),
    });
    if (n.kind === 'decision') { out.fill = hexA(sevColor(n.label), 0.85); out.stroke = sevColor(n.label); }
    else if (n.kind === 'device') { out.fill = 'rgba(90,167,240,.3)'; out.stroke = '#5aa7f0'; }
    else if (n.kind === 'destination') { out.fill = 'rgba(155,110,224,.25)'; out.stroke = '#9e6ee0'; }
    else { out.fill = 'rgba(226,229,235,.18)'; out.stroke = '#8b93a3'; }
    byId[n.id] = out;
    return out;
  });
  var laidOutEdges = edges.map(function(e){
    var relColor = { observed:'#4a5568', targets:'#5a6478', supports:'#22c7e0', contradicts:'#e0523f' };
    return Object.assign({}, e, { stroke: relColor[e.relation] || '#6b7280', dash: e.relation==='contradicts' ? '4,3' : '' });
  });
  return { nodes: laidOut, edges: laidOutEdges, byId: byId };
}

async function loadGraph(){
  state.graphLoading = true; state.graphLoadError = null; render();
  try {
    var data = await apiFetch('/api/graph?limit=25');
    var laid = computeGraphLayout(data.nodes, data.edges);
    state.graphNodes = laid.nodes;
    state.graphEdges = laid.edges;
    state.graphNodeById = laid.byId;
    state.graphLoaded = true;
  } catch (err) {
    state.graphLoadError = err.message || String(err);
  } finally {
    state.graphLoading = false; render();
  }
}

async function loadConfig(){
  state.configLoading = true;
  state.configLoadError = null;
  render();
  try {
    var data = await apiFetch('/api/config');
    state.configRows = data.rows;
    state.deviceTypeOverrides = data.device_type_overrides;
    state.deviceTypes = data.device_types && data.device_types.length ? data.device_types : FALLBACK_DEVICE_TYPES;
    if (!state.configSection && data.rows.length) state.configSection = data.rows[0].section;
    state.configLoaded = true;
  } catch (err) {
    state.configLoadError = err.message || String(err);
  } finally {
    state.configLoading = false;
    render();
  }
}

      var all = decItems.concat(evItems).sort(function(a,b){ return a.t>b.t?-1:1; }).map(function(x){ return x.html; }).join('');

function renderGraphView(){
  var topbarHead = '<div class="topbar"><div class="view-title">Evidence graph</div><div class="view-sub">Most recent 25 decisions and everything connected to them — devices → evidence → destinations, evidence → decisions. Click any node to inspect it; toggle kinds off to declutter. A single busy decision\'s evidence is capped per-decision (see the drawer for "N of TOTAL" when truncated).</div></div>';

  if (state.graphLoadError) {
    return topbarHead + '<div class="content"><div class="error-banner">Could not load the graph: '+esc(state.graphLoadError)+'.<br><button class="btn btn-primary btn-sm" onclick="app.reloadGraph()">Retry</button></div></div>';
  }
  if (state.graphLoading && !state.graphLoaded) {
    return topbarHead + '<div class="content"><div class="empty-state">Loading the evidence graph…</div></div>';
  }
  if (state.graphLoaded && !state.graphNodes.length) {
    return topbarHead + '<div class="content"><div class="empty-state">No decisions in the graph yet.</div></div>';
  }

  var visibleNodes = state.graphNodes.filter(function(n){ return state.graphShow[n.kind]; });
  var visibleIds = {}; visibleNodes.forEach(function(n){ visibleIds[n.id]=true; });
  var visibleEdges = state.graphEdges.filter(function(e){ return visibleIds[e.from] && visibleIds[e.to]; });
  var byId = state.graphNodeById || {};

  var edgesSvg = visibleEdges.map(function(e){
    var a = byId[e.from], b = byId[e.to];
    if (!a || !b) return '';
    var touches = !state.graphSelected || e.from===state.graphSelected || e.to===state.graphSelected;
    return '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+e.stroke+'" stroke-width="'+(touches?1.6:1)+'" opacity="'+(touches?0.9:0.12)+'" stroke-dasharray="'+(e.dash||'')+'"></line>';
  }).join('');
  var maxY = Math.max(300, visibleNodes.reduce(function(m,n){ return Math.max(m, n.y); }, 0) + 60);
  var nodesSvg = visibleNodes.map(function(n){
    var connected = !state.graphSelected || n.id===state.graphSelected || state.graphEdges.some(function(e){
      return (e.from===state.graphSelected && e.to===n.id) || (e.to===state.graphSelected && e.from===n.id);
    });
    var sw = n.id===state.graphSelected ? 3 : 1;
    var label = n.kind === 'evidence' ? n.label : (n.label && n.label.length > 26 ? n.label.slice(0,24)+'…' : n.label);
    return '<g onclick="app.selectGraphNode(\''+n.id+'\')" style="cursor:pointer;opacity:'+(connected?1:0.22)+';">'
      + '<circle cx="'+n.x+'" cy="'+n.y+'" r="'+n.r+'" fill="'+n.fill+'" stroke="'+n.stroke+'" stroke-width="'+sw+'"></circle>'
      + '<text class="node-label" x="'+(n.x+n.r+6)+'" y="'+(n.y+3)+'">'+esc(label)+'</text>'
      + '<text class="node-sub" x="'+(n.x+n.r+6)+'" y="'+(n.y+14)+'">'+esc(n.sub||'')+'</text></g>';
  }).join('');

  var legend = GRAPH_LEGEND_DEFS.map(function(l){
    var bg = state.graphShow[l.kind] ? l.bg : 'transparent';
    return '<div class="legend-row" onclick="app.toggleGraphKind(\''+l.kind+'\')"><div class="legend-check" style="background:'+bg+';border-color:'+l.color+';"></div><span style="color:var(--text-dim);">'+l.label+'</span></div>';
  }).join('');

  var drawer;
  if (state.graphSelected && byId[state.graphSelected]) {
    var n = byId[state.graphSelected];
    var fields = [];
    if (n.kind==='device') {
      fields = [['device_id', n.sub], ['hostname', n.label]];
    } else if (n.kind==='evidence') {
      fields = [['type',n.label],['family',n.sub],['confidence',n.confidence],['source',n.source],['timestamp', fmtTime(n.timestamp)]];
    } else if (n.kind==='destination') {
      fields = [['kind',n.sub],['label',n.label]];
    } else {
      fields = [['state',n.label],['decision_id',n.sub],['risk_score',n.risk_score],['confidence',n.confidence],
                ['timestamp', fmtTime(n.timestamp)],['explanation', n.winning_hypothesis || '—'],
                ['evidence shown', n.evidence_truncated ? ('capped — showing recent subset of ' + n.evidence_total) : (n.evidence_total || 0)]];
    }
    var kvRows = fields.map(function(f){ return '<div class="kv-row"><div class="kv-key">'+f[0]+'</div><div class="kv-val cell-mono">'+esc(String(f[1]))+'</div></div>'; }).join('');
    drawer = '<div style="font-size:10.5px;color:var(--text-faint);margin-bottom:2px;">'+n.kind.toUpperCase()+'</div><div style="font-size:14px;font-weight:600;margin-bottom:12px;">'+esc(n.label)+'</div>'+kvRows;
  } else {
    drawer = '<div class="empty-state">Click a node to inspect its fields.</div>';
  }

  return topbarHead
    + '<div class="content"><div class="graph-wrap"><div class="graph-canvas"><div class="graph-legend">'+legend+'</div>'
    + '<svg width="1080" height="'+maxY+'" style="display:block;">'+edgesSvg+nodesSvg+'</svg></div>'
    + '<div class="graph-drawer">'+drawer+'</div></div></div>';
}

function renderConfigView(){
  if (state.configLoadError) {
    return '<div class="topbar"><div class="view-title">Config — config.yaml</div></div>'
      + '<div class="content"><div class="error-banner">Could not reach the config API: '+esc(state.configLoadError)+'.<br>'
      + 'This page needs to be served by the home_ids app itself (e.g. <span class="cell-mono">http://&lt;server&gt;:8010/console</span>) — opening it from a plain file or a different origin can\'t reach these endpoints.'
      + '<br><button class="btn btn-primary btn-sm" onclick="app.reloadConfig()">Retry</button></div></div>';
  }
  if (state.configLoading && !state.configLoaded) {
    return '<div class="topbar"><div class="view-title">Config — config.yaml</div></div><div class="content"><div class="empty-state">Loading live values from the server…</div></div>';
  }

  var sections = [];
  state.configRows.forEach(function(r){ if (sections.indexOf(r.section) === -1) sections.push(r.section); });
  var sectionsHtml = sections.map(function(s){
    var active = !state.configSearch && s===state.configSection;
    return '<div class="section-item'+(active?' active':'')+(s==='external_system_paths'?' danger':'')+'" onclick="app.setConfigSection(\''+s+'\')">'+s+'</div>';
  }).join('');

  var danger = (!state.configSearch && state.configSection==='external_system_paths')
    ? '<div class="danger-banner">⚠ external_system_paths points at OTHER software’s install layout on this machine (Pi-hole, Zeek). Get one wrong and the failure is silent. This section is read-only here regardless (restart-required).</div>'
    : '';

  var deviceTypeMapHtml = '';
  if (!state.configSearch && state.configSection==='network_and_devices') {
    var rows = state.deviceTypeOverrides.map(function(o){
      return '<tr><td class="cell-mono">'+esc(o.pattern)+'</td><td><select class="select mono" onchange="app.setOverrideType(\''+esc(o.pattern)+'\', this.value)">'+typeOptionsHtml(o.type)+'</select></td>'
        + '<td><button class="icon-btn" onclick="app.removeOverride(\''+esc(o.pattern)+'\')">'+ICONS.close+'</button></td></tr>';
    }).join('');
    deviceTypeMapHtml = '<div class="panel" style="margin-bottom:16px;"><div class="panel-header"><div class="panel-title">device_type_overrides <span class="badge badge-live" style="margin-left:8px;">LIVE, real</span></div>'
      + '<span style="font-size:11px;color:var(--text-faint);">hostname substring → type, first match wins</span></div>'
      + '<div class="table-wrap"><table><thead><tr><th>Pattern</th><th>Type</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      + '<div class="panel-body" style="padding-top:10px;"><div class="row" style="gap:8px;">'
      + '<input class="input mono" style="flex:1;" placeholder="hostname pattern, e.g. LIVINGROOM" value="'+esc(state.newOverridePattern)+'" onchange="app.onNewOverridePattern(this.value)">'
      + '<select class="select mono" onchange="app.onNewOverrideType(this.value)">'+typeOptionsHtml(state.newOverrideType)+'</select>'
      + '<button class="btn" onclick="app.addOverride()">+ Add override</button></div></div></div>';
  }

  var q = state.configSearch.toLowerCase();
  var baseRows = state.configSearch
    ? state.configRows.filter(function(r){ return r.key.toLowerCase().indexOf(q)>=0 || r.description.toLowerCase().indexOf(q)>=0; })
    : state.configRows.filter(function(r){ return r.section===state.configSection; });

  var rowsHtml = baseRows.map(function(r){
    var control;
    if (!r.editable) {
      control = '<input class="input mono" style="width:100%;max-width:420px;" value="'+esc(Array.isArray(r.value)?r.value.join(', '):r.value)+'" disabled title="restart required -- not editable here">';
    } else if (r.type==='bool') {
      var toggleBg = r.value ? 'rgba(34,199,224,.25)' : 'var(--bg-elevated)';
      var knobLeft = r.value ? '17px' : '2px';
      var knobColor = r.value ? 'var(--accent)' : 'var(--text-faint)';
      control = '<div class="toggle" style="background:'+toggleBg+';" onclick="app.toggleBool(\''+r.key+'\')"><div class="toggle-knob" style="left:'+knobLeft+';background:'+knobColor+';"></div></div>';
    } else if (r.type==='enum') {
      var opts = (r.options||[]).map(function(v){ return '<option value="'+v+'"'+(v===r.value?' selected':'')+'>'+v+'</option>'; }).join('');
      control = '<select class="select mono" style="width:220px;" onchange="app.setConfigValue(\''+r.key+'\', this.value)">'+opts+'</select>';
    } else if (r.type==='number') {
      control = '<input class="input mono" style="width:220px;" value="'+esc(r.value)+'" onchange="app.setConfigValue(\''+r.key+'\', this.value)">';
    } else if (r.type==='list') {
      var chips = (r.value||[]).map(function(v, idx){
        return '<span class="chip">'+esc(v)+'<button onclick="app.removeListItem(\''+r.key+'\','+idx+')">✕</button></span>';
      }).join('');
      control = '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">'+chips
        + '<input class="input mono" style="width:150px;padding:4px 8px;" placeholder="+ add" onkeydown="if(event.key===\'Enter\'){app.addListItem(\''+r.key+'\', this.value); this.value=\'\';}">'
        + '</div>';
    } else {
      control = '<input class="input mono" style="width:100%;max-width:420px;" value="'+esc(r.value)+'" onchange="app.setConfigValue(\''+r.key+'\', this.value)">';
    }

    return '<div class="config-row">'
      + '<div class="config-key-col"><div class="config-key"><span>'+r.key+'</span>'
      + (r.restart_required ? '<span class="badge badge-restart">RESTART</span>' : '<span class="badge badge-live">LIVE</span>')
      + (r.overridden ? '<span class="modified-dot" title="overridden"></span>' : '')
      + (state.configSearch ? '<span class="tag">'+r.section+'</span>' : '')
      + '</div><div class="config-desc">'+esc(r.description)+'</div></div>'
      + '<div class="config-val-col">'+control
      + '<div class="config-default">suggested: '+esc(Array.isArray(r.suggested_default)?r.suggested_default.join(', '):r.suggested_default)
      + (r.overridden ? ' <span class="icon-btn btn-sm" style="width:auto;padding:1px 7px;height:auto;" onclick="app.resetConfigValue(\''+r.key+'\')">reset</span>' : '')+'</div>'
      + '</div></div>';
  }).join('');
  if (!rowsHtml) rowsHtml = '<div class="empty-state">No keys match “'+esc(state.configSearch)+'”.</div>';

  return ''
    + '<div class="topbar"><div class="topbar-row">'
    + '<div><div class="view-title">Config — config.yaml</div><div class="view-sub">Every LIVE key, grouped as it is on disk, reading and writing the real server via state/config_overrides.json. RESTART keys show current value but aren\'t editable here.</div></div>'
    + '<div class="search-wrap">'+ICONS.search+'<input id="configSearchInput" class="input search-input" placeholder="Search all keys…" value="'+esc(state.configSearch)+'" oninput="app.onConfigSearch(this.value)"></div>'
    + '</div></div>'
    + '<div class="content" style="padding:0;"><div class="config-body">'
    + '<div class="section-nav">'+sectionsHtml+'</div>'
    + '<div class="config-scroll">'+danger+deviceTypeMapHtml+rowsHtml+'</div>'
    + '</div></div>';
}

function renderApp(){
  var view = '';
  if (state.activeView==='devices') view = renderDevicesView();
  else if (state.activeView==='deviceDetail') view = renderDeviceDetailView();
  else if (state.activeView==='hunt') view = renderHuntView();
  else if (state.activeView==='graph') view = renderGraphView();
  else view = renderConfigView();
  return renderSidebar() + '<div class="main-panel">'+view+'</div>';
}

function render(){
  var active = document.activeElement;
  var id = (active && active.id) ? active.id : null;
  var selStart = null, selEnd = null;
  if (active && typeof active.selectionStart === 'number') { selStart = active.selectionStart; selEnd = active.selectionEnd; }
  document.getElementById('app').innerHTML = renderApp();
  if (id) {
    var el = document.getElementById(id);
    if (el) {
      el.focus();
      if (selStart !== null) { try { el.setSelectionRange(selStart, selEnd); } catch(e){} }
    }
  }
}

/* ============================= app actions ============================= */

var app = {
  goView: function(v){
    state.activeView = v;
    render();
    if (v === 'config' && !state.configLoading) loadConfig();
    if (v === 'devices' && !state.devicesLoading && !state.devicesLoaded) loadDevices();
    if (v === 'hunt' && !state.devicesLoading && !state.devicesLoaded) loadDevices();
    if (v === 'graph' && !state.graphLoading && !state.graphLoaded) loadGraph();
  },
  selectDevice: function(id){ state.activeView='deviceDetail'; state.selectedDeviceId=id; render(); loadDeviceDetail(id); },
  backToDevices: function(){ state.activeView='devices'; render(); },
  traceThisDevice: function(){
    state.activeView='hunt'; state.huntMode='history'; state.huntDeviceId=state.selectedDeviceId;
    state.huntSinceDays=''; state.huntRan=false; render();
    runHuntQuery();
  },
  toggleSort: function(f){ state.sortDir = (state.sortField===f && state.sortDir==='asc') ? 'desc' : 'asc'; state.sortField=f; render(); },
  onDeviceSearch: function(v){ state.deviceSearch=v; render(); },
  reloadDevices: function(){ state.devicesLoaded=false; loadDevices(); },
  reloadGraph: function(){ state.graphLoaded=false; loadGraph(); },

  goHuntMode: function(m){ state.huntMode=m; state.huntRan=false; state.huntResult=null; state.huntError=null; render(); },
  runHuntQuery: function(){ runHuntQuery(); },
  onHuntDest: function(v){ state.huntDest=v; render(); },
  onHuntDecisionInput: function(v){ state.huntDecisionId=v; render(); },
  onHuntDevice: function(v){ state.huntDeviceId=v; render(); },
  onHuntSinceDays: function(v){ state.huntSinceDays=v; render(); },

  selectGraphNode: function(id){ state.graphSelected=id; render(); },
  toggleGraphKind: function(k){ state.graphShow[k]=!state.graphShow[k]; render(); },

  changeToken: function(){
    var entered = window.prompt('API token (fritz_api_token / API_SECRET_TOKEN):', getToken());
    if (entered !== null) { setToken(entered.trim()); render(); }
  },
  reloadConfig: function(){ loadConfig(); },
  onConfigSearch: function(v){ state.configSearch=v; render(); },
  setConfigSection: function(s){ state.configSection=s; state.configSearch=''; render(); },

  setConfigValue: async function(key, rawValue){
    try {
      await apiFetch('/api/config/' + encodeURIComponent(key), { method: 'PATCH', body: JSON.stringify({ value: rawValue }) });
      await loadConfig();
    } catch (err) { window.alert('Save failed: ' + err.message); render(); }
  },
  toggleBool: async function(key){
    var row = state.configRows.filter(function(r){ return r.key===key; })[0];
    await app.setConfigValue(key, !row.value);
  },
  removeListItem: async function(key, idx){
    var row = state.configRows.filter(function(r){ return r.key===key; })[0];
    var arr = row.value.slice(); arr.splice(idx, 1);
    await app.setConfigValue(key, arr);
  },
  addListItem: async function(key, val){
    val = (val||'').trim(); if (!val) return;
    var row = state.configRows.filter(function(r){ return r.key===key; })[0];
    await app.setConfigValue(key, row.value.concat([val]));
  },
  resetConfigValue: async function(key){
    try { await apiFetch('/api/config/' + encodeURIComponent(key), { method: 'DELETE' }); await loadConfig(); }
    catch (err) { window.alert('Reset failed: ' + err.message); render(); }
  },

  assignDeviceType: async function(pattern, type){
    try {
      await apiFetch('/api/config/device_type_overrides/' + encodeURIComponent(pattern), { method: 'PATCH', body: JSON.stringify({ type: type }) });
      var data = await apiFetch('/api/config');
      state.deviceTypeOverrides = data.device_type_overrides;
      if (state.deviceDetail) await loadDeviceDetail(state.deviceDetail.device_id);
      else render();
    } catch (err) { window.alert('Save failed: ' + err.message); render(); }
  },
  setOverrideType: function(pattern, type){ app.assignDeviceType(pattern, type); },
  removeOverride: async function(pattern){
    try {
      await apiFetch('/api/config/device_type_overrides/' + encodeURIComponent(pattern), { method: 'DELETE' });
      await loadConfig();
    } catch (err) { window.alert('Remove failed: ' + err.message); render(); }
  },
  onNewOverridePattern: function(v){ state.newOverridePattern=v; render(); },
  onNewOverrideType: function(v){ state.newOverrideType=v; render(); },
  addOverride: async function(){
    if (!state.newOverridePattern.trim()) return;
    await app.assignDeviceType(state.newOverridePattern.trim(), state.newOverrideType);
    state.newOverridePattern = '';
    render();
  }
};

render();
if (state.activeView === 'config') loadConfig();
if (state.activeView === 'devices') loadDevices();
if (state.activeView === 'graph') loadGraph();
</script>
</body>
</html>
