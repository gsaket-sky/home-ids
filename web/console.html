function renderGraphView(){
  var topbarHead = '<div class="topbar"><div class="view-title">Evidence graph</div><div class="view-sub">Most recent 25 decisions and everything connected to them — devices → evidence → destinations, evidence → decisions. Drag any node to rearrange it; shift-click nodes (or shift-drag a box over several) to select a group and drag any of them to move the whole group together; drag the background to pan, scroll to zoom, click a node to inspect it. A single busy decision\'s evidence is capped per-decision (see the drawer for "N of TOTAL" when truncated).</div></div>';

  if (state.graphLoadError) {
    return topbarHead + '<div class="content"><div class="error-banner">Could not load the graph: '+esc(state.graphLoadError)+'.<br><button class="btn btn-primary btn-sm" onclick="app.reloadGraph()">Retry</button></div></div>';
  }
  if (state.graphLoading && !state.graphLoaded) {
    return topbarHead + '<div class="content"><div class="empty-state">Loading the evidence graph…</div></div>';
  }
  if (state.graphLoaded && !state.graphNodes.length) {
    return topbarHead + '<div class="content"><div class="empty-state">No decisions in the graph yet.</div></div>';
  }

  var visibleNodes = state.graphNodes.filter(function(n){ return state.graphShow[n.kind]; });
  var visibleIds = {}; visibleNodes.forEach(function(n){ visibleIds[n.id]=true; });
  var visibleEdges = state.graphEdges.filter(function(e){ return visibleIds[e.from] && visibleIds[e.to]; });
  var byId = state.graphNodeById || {};

  var edgesSvg = visibleEdges.map(function(e){
    var a = byId[e.from], b = byId[e.to];
    if (!a || !b) return '';
    var touches = !state.graphSelected || e.from===state.graphSelected || e.to===state.graphSelected;
    return '<line data-edge-from="'+e.from+'" data-edge-to="'+e.to+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+e.stroke+'" stroke-width="'+(touches?1.6:1)+'" opacity="'+(touches?0.9:0.12)+'" stroke-dasharray="'+(e.dash||'')+'"></line>';
  }).join('');
  var nodesSvg = visibleNodes.map(function(n){
    var connected = !state.graphSelected || n.id===state.graphSelected || state.graphEdges.some(function(e){
      return (e.from===state.graphSelected && e.to===n.id) || (e.to===state.graphSelected && e.from===n.id);
    });
    var sw = n.id===state.graphSelected ? 3 : 1;
    var label = n.kind === 'evidence' ? (n.type_label || n.label) : (n.label && n.label.length > 26 ? n.label.slice(0,24)+'…' : n.label);
    var multiSel = !!state.graphMultiSelected[n.id];
    var ring = multiSel ? '<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(n.r+5)+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3,2"></circle>' : '';
    return '<g class="node-group'+(multiSel?' multi-selected':'')+'" data-node-id="'+n.id+'" style="opacity:'+(connected?1:0.22)+';">'
      + ring
      + '<circle cx="'+n.x+'" cy="'+n.y+'" r="'+n.r+'" fill="'+n.fill+'" stroke="'+n.stroke+'" stroke-width="'+sw+'"></circle>'
      + '<text class="node-label" x="'+(n.x+n.r+6)+'" y="'+(n.y+3)+'">'+esc(label)+'</text>'
      + '<text class="node-sub" x="'+(n.x+n.r+6)+'" y="'+(n.y+14)+'">'+esc(n.sub||'')+'</text></g>';
  }).join('');

  var legend = GRAPH_LEGEND_DEFS.map(function(l){
    var bg = state.graphShow[l.kind] ? l.bg : 'transparent';
    return '<div class="legend-row" onclick="app.toggleGraphKind(\''+l.kind+'\')"><div class="legend-check" style="background:'+bg+';border-color:'+l.color+';"></div><span style="color:var(--text-dim);">'+l.label+'</span></div>';
  }).join('');
  var selCount = Object.keys(state.graphMultiSelected).length;
  var zoomControls = '<div class="graph-legend" style="left:auto;right:12px;top:12px;flex-direction:row;gap:6px;padding:6px 8px;align-items:center;">'
    + (selCount ? '<span style="font-size:11px;color:var(--text-dim);white-space:nowrap;">'+selCount+' selected</span><button class="btn btn-ghost btn-sm" onclick="app.graphClearSelection()">Clear</button>' : '')
    + '<button class="icon-btn" title="zoom in" onclick="app.graphZoomBy(1.2)">+</button>'
    + '<button class="icon-btn" title="zoom out" onclick="app.graphZoomBy(0.8)">−</button>'
    + '<button class="icon-btn" title="fit to view" onclick="app.graphFitToView()">⛶</button>'
    + '<button class="icon-btn" title="reset zoom" onclick="app.graphResetView()">⟲</button></div>';

  var drawer;
  if (state.graphSelected && byId[state.graphSelected]) {
    var n = byId[state.graphSelected];
    var fields = [];
    if (n.kind==='device') {
      fields = [['device_id', n.sub], ['hostname', n.label]];
    } else if (n.kind==='evidence') {
      fields = [['what happened', (n.type_label || n.label) + (n.type_description ? ' — ' + n.type_description : '')],
                ['raw type', n.label], ['family',n.sub],['confidence',n.confidence],['source',n.source],['timestamp', fmtTime(n.timestamp)]];
    } else if (n.kind==='destination') {
      fields = [['kind',n.sub],['label',n.label]];
    } else {
      var explanation = n.winning_hypothesis_label
        ? n.winning_hypothesis_label + (n.winning_hypothesis_description ? ' — ' + n.winning_hypothesis_description : '')
        : (n.winning_hypothesis || '—');
      fields = [['state',n.label],['decision_id',n.sub],['risk_score',n.risk_score],['confidence',n.confidence],
                ['timestamp', fmtTime(n.timestamp)],['explanation', explanation],
                ['evidence shown', n.evidence_truncated ? ('capped — showing recent subset of ' + n.evidence_total) : (n.evidence_total || 0)]];
    }
    var kvRows = fields.map(function(f){ return '<div class="kv-row"><div class="kv-key">'+f[0]+'</div><div class="kv-val cell-mono">'+esc(String(f[1]))+'</div></div>'; }).join('');
    drawer = '<div style="font-size:10.5px;color:var(--text-faint);margin-bottom:2px;">'+n.kind.toUpperCase()+'</div><div style="font-size:14px;font-weight:600;margin-bottom:12px;">'+esc(n.type_label || n.label)+'</div>'+kvRows;
  } else {
    drawer = '<div class="empty-state">Click a node to inspect its fields.</div>';
  }

  var transform = 'translate('+state.graphPan.x+','+state.graphPan.y+') scale('+state.graphZoom+')';
  return topbarHead
    + '<div class="content"><div class="graph-wrap"><div class="graph-canvas" id="graphCanvas"><div class="graph-legend">'+legend+'</div>'+zoomControls
    + '<svg id="graphSvg" width="100%" height="100%" style="display:block;"><g id="graphViewport" transform="'+transform+'">'+edgesSvg+nodesSvg+'</g></svg></div>'
    + '<div class="graph-drawer">'+drawer+'</div></div></div>';
}

/* ============================= Evidence Graph: drag / pan / zoom ============================= */

function _updateGraphTransform(){
  var vp = document.getElementById('graphViewport');
  if (vp) vp.setAttribute('transform', 'translate('+state.graphPan.x+','+state.graphPan.y+') scale('+state.graphZoom+')');
}

function _moveGraphNodeDom(id){
  var n = (state.graphNodeById || {})[id];
  if (!n) return;
  var g = document.querySelector('[data-node-id="'+CSS.escape(id)+'"]');
  if (g) {
    var circle = g.querySelector('circle'), labels = g.querySelectorAll('text');
    if (circle) { circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y); }
    if (labels[0]) { labels[0].setAttribute('x', n.x+n.r+6); labels[0].setAttribute('y', n.y+3); }
    if (labels[1]) { labels[1].setAttribute('x', n.x+n.r+6); labels[1].setAttribute('y', n.y+14); }
  }
  document.querySelectorAll('[data-edge-from="'+CSS.escape(id)+'"]').forEach(function(line){
    line.setAttribute('x1', n.x); line.setAttribute('y1', n.y);
  });
  document.querySelectorAll('[data-edge-to="'+CSS.escape(id)+'"]').forEach(function(line){
    line.setAttribute('x2', n.x); line.setAttribute('y2', n.y);
  });
}

function fitGraphToView(canvas){
  var nodes = state.graphNodes;
  if (!nodes || !nodes.length) return;
  var minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  nodes.forEach(function(n){
    minX = Math.min(minX, n.x - n.r); maxX = Math.max(maxX, n.x + n.r + 150); // +150 clears the label text to the right
    minY = Math.min(minY, n.y - n.r); maxY = Math.max(maxY, n.y + n.r);
  });
  var contentW = Math.max(1, maxX - minX), contentH = Math.max(1, maxY - minY);
  var canvasW = canvas.clientWidth || 1000, canvasH = canvas.clientHeight || 600;
  var pad = 30;
  var scale = Math.min((canvasW - pad*2) / contentW, (canvasH - pad*2) / contentH);
  scale = Math.max(0.06, Math.min(1.4, scale));
  state.graphZoom = scale;
  state.graphPan = {
    x: pad - minX*scale + Math.max(0, (canvasW - pad*2 - contentW*scale) / 2),
    y: pad - minY*scale + Math.max(0, (canvasH - pad*2 - contentH*scale) / 2),
  };
  _updateGraphTransform();
}

function _clientToWorld(canvas, clientX, clientY){
  var rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left - state.graphPan.x) / state.graphZoom,
    y: (clientY - rect.top - state.graphPan.y) / state.graphZoom,
  };
}

function attachGraphInteraction(){
  var canvas = document.getElementById('graphCanvas');
  if (!canvas) return;
  if (state.graphFitPending) {
    fitGraphToView(canvas);
    state.graphFitPending = false;
  }
  if (canvas._interactionAttached) return;
  canvas._interactionAttached = true;

  canvas.addEventListener('pointerdown', function(e){
    var nodeGroup = e.target.closest('[data-node-id]');
    var startX = e.clientX, startY = e.clientY;
    var moved = false;
    canvas.setPointerCapture(e.pointerId);

    if (nodeGroup) {
      var id = nodeGroup.getAttribute('data-node-id');

      // Shift-click a node: toggle its group-selection membership, no drag.
      if (e.shiftKey) {
        if (state.graphMultiSelected[id]) delete state.graphMultiSelected[id];
        else state.graphMultiSelected[id] = true;
        render();
        return;
      }

      var groupIds = state.graphMultiSelected[id] ? Object.keys(state.graphMultiSelected) : [id];
      var starts = {};
      groupIds.forEach(function(gid){
        var gn = (state.graphNodeById || {})[gid];
        if (gn) starts[gid] = { x: gn.x, y: gn.y };
      });
      nodeGroup.classList.add('dragging');
      var onMove = function(ev){
        var dx = (ev.clientX - startX) / state.graphZoom, dy = (ev.clientY - startY) / state.graphZoom;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
        groupIds.forEach(function(gid){
          var gn = (state.graphNodeById || {})[gid];
          var s = starts[gid];
          if (!gn || !s) return;
          gn.x = s.x + dx; gn.y = s.y + dy;
          _moveGraphNodeDom(gid);
        });
      };
      var onUp = function(){
        canvas.removeEventListener('pointermove', onMove);
        canvas.removeEventListener('pointerup', onUp);
        nodeGroup.classList.remove('dragging');
        if (!moved) app.selectGraphNode(id);
      };
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
    } else if (e.shiftKey) {
      // Shift-drag empty background: rubber-band select every node inside the box
      // (added to any group already selected, so several shift-drags can build one
      // group up across separate regions of a busy graph).
      var svgNs = 'http://www.w3.org/2000/svg';
      var rectEl = document.createElementNS(svgNs, 'rect');
      rectEl.setAttribute('fill', 'rgba(34,199,224,.12)');
      rectEl.setAttribute('stroke', 'var(--accent)');
      rectEl.setAttribute('stroke-width', '1');
      rectEl.setAttribute('stroke-dasharray', '4,3');
      document.getElementById('graphViewport').appendChild(rectEl);
      var w0 = _clientToWorld(canvas, startX, startY);
      var onMove3 = function(ev){
        var w1 = _clientToWorld(canvas, ev.clientX, ev.clientY);
        var x = Math.min(w0.x, w1.x), y = Math.min(w0.y, w1.y);
        rectEl.setAttribute('x', x); rectEl.setAttribute('y', y);
        rectEl.setAttribute('width', Math.abs(w1.x - w0.x));
        rectEl.setAttribute('height', Math.abs(w1.y - w0.y));
      };
      var onUp3 = function(ev){
        canvas.removeEventListener('pointermove', onMove3);
        canvas.removeEventListener('pointerup', onUp3);
        var w1 = _clientToWorld(canvas, ev.clientX, ev.clientY);
        var minX = Math.min(w0.x, w1.x), maxX = Math.max(w0.x, w1.x);
        var minY = Math.min(w0.y, w1.y), maxY = Math.max(w0.y, w1.y);
        state.graphNodes.forEach(function(n){
          if (state.graphShow[n.kind] && n.x >= minX && n.x <= maxX && n.y >= minY && n.y <= maxY) {
            state.graphMultiSelected[n.id] = true;
          }
        });
        rectEl.remove();
        render();
      };
      canvas.addEventListener('pointermove', onMove3);
      canvas.addEventListener('pointerup', onUp3);
    } else {
      canvas.classList.add('panning');
      var panX0 = state.graphPan.x, panY0 = state.graphPan.y;
      var onMove2 = function(ev){
        state.graphPan.x = panX0 + (ev.clientX - startX);
        state.graphPan.y = panY0 + (ev.clientY - startY);
        _updateGraphTransform();
      };
      var onUp2 = function(){
        canvas.removeEventListener('pointermove', onMove2);
        canvas.removeEventListener('pointerup', onUp2);
        canvas.classList.remove('panning');
      };
      canvas.addEventListener('pointermove', onMove2);
      canvas.addEventListener('pointerup', onUp2);
    }
  });

  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var wx = (mx - state.graphPan.x) / state.graphZoom, wy = (my - state.graphPan.y) / state.graphZoom;
    var newZoom = Math.max(0.06, Math.min(3, state.graphZoom * (e.deltaY < 0 ? 1.08 : 0.92)));
    state.graphPan.x = mx - wx * newZoom;
    state.graphPan.y = my - wy * newZoom;
    state.graphZoom = newZoom;
    _updateGraphTransform();
  }, { passive: false });
}

function renderConfigView(){
  if (state.configLoadError) {
    return '<div class="topbar"><div class="view-title">Config — config.yaml</div></div>'
      + '<div class="content"><div class="error-banner">Could not reach the config API: '+esc(state.configLoadError)+'.<br>'
      + 'This page needs to be served by the home_ids app itself (e.g. <span class="cell-mono">http://&lt;server&gt;:8010/console</span>) — opening it from a plain file or a different origin can\'t reach these endpoints.'
      + '<br><button class="btn btn-primary btn-sm" onclick="app.reloadConfig()">Retry</button></div></div>';
  }
  if (state.configLoading && !state.configLoaded) {
    return '<div class="topbar"><div class="view-title">Config — config.yaml</div></div><div class="content"><div class="empty-state">Loading live values from the server…</div></div>';
  }

  var sections = [];
  state.configRows.forEach(function(r){ if (sections.indexOf(r.section) === -1) sections.push(r.section); });
  var sectionsHtml = sections.map(function(s){
    var active = !state.configSearch && s===state.configSection;
    return '<div class="section-item'+(active?' active':'')+(s==='external_system_paths'?' danger':'')+'" onclick="app.setConfigSection(\''+s+'\')">'+s+'</div>';
  }).join('');

  var danger = (!state.configSearch && state.configSection==='external_system_paths')
    ? '<div class="danger-banner">⚠ external_system_paths points at OTHER software’s install layout on this machine (Pi-hole, Zeek). Get one wrong and the failure is silent. This section is read-only here regardless (restart-required).</div>'
    : '';

  var deviceTypeMapHtml = '';
  var overridePendingCount = Object.keys(state.pendingOverrideEdits).length
    + Object.values(state.pendingOverrideRemovals).filter(Boolean).length
    + state.pendingNewOverrides.length;
  if (!state.configSearch && state.configSection==='network_and_devices') {
    var rows = state.deviceTypeOverrides.map(function(o){
      var removing = !!state.pendingOverrideRemovals[o.pattern];
      var pendingType = app.currentOverrideType(o);
      var dirty = pendingType !== o.type;
      return '<tr style="'+(removing?'opacity:.45;text-decoration:line-through;':'')+'">'
        + '<td class="cell-mono">'+esc(o.pattern)+(dirty&&!removing?'<span class="pending-dot" title="unsaved change"></span>':'')+'</td>'
        + '<td><select class="select mono" '+(removing?'disabled':'')+' onchange="app.setOverrideType(\''+esc(o.pattern)+'\', this.value)">'+typeOptionsHtml(pendingType)+'</select></td>'
        + '<td><button class="icon-btn" title="'+(removing?'undo remove':'remove')+'" onclick="app.removeOverride(\''+esc(o.pattern)+'\')">'+ICONS.close+'</button></td></tr>';
    }).join('') + state.pendingNewOverrides.map(function(a, idx){
      return '<tr><td class="cell-mono">'+esc(a.pattern)+'<span class="pending-dot" title="unsaved, new"></span></td>'
        + '<td><span class="tag">'+esc(a.type)+'</span></td>'
        + '<td><button class="icon-btn" onclick="app.removePendingNewOverride('+idx+')">'+ICONS.close+'</button></td></tr>';
    }).join('');
    var overrideSaveBar = overridePendingCount
      ? '<div class="save-bar" style="border-radius:0 0 6px 6px;"><span>'+overridePendingCount+' unsaved change(s)</span>'
        + '<div style="display:flex;gap:8px;"><button class="btn btn-sm" onclick="app.discardOverrideEdits()" '+(state.overridesSaving?'disabled':'')+'>Discard</button>'
        + '<button class="btn btn-primary btn-sm" onclick="app.saveOverrideEdits()" '+(state.overridesSaving?'disabled':'')+'>'+(state.overridesSaving?'Saving…':'Save changes')+'</button></div></div>'
      : '';
    deviceTypeMapHtml = '<div class="panel" style="margin-bottom:16px;"><div class="panel-header"><div class="panel-title">device_type_overrides <span class="badge badge-live" style="margin-left:8px;">LIVE, real</span></div>'
      + '<span style="font-size:11px;color:var(--text-faint);">hostname substring → type, first match wins</span></div>'
      + '<div class="table-wrap"><table><thead><tr><th>Pattern</th><th>Type</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      + '<div class="panel-body" style="padding-top:10px;"><div class="row" style="gap:8px;">'
      + '<input class="input mono" style="flex:1;" placeholder="hostname pattern, e.g. LIVINGROOM" value="'+esc(state.newOverridePattern)+'" onchange="app.onNewOverridePattern(this.value)">'
      + '<select class="select mono" onchange="app.onNewOverrideType(this.value)">'+typeOptionsHtml(state.newOverrideType)+'</select>'
      + '<button class="btn" onclick="app.addOverride()">+ Stage override</button></div></div>'
      + overrideSaveBar + '</div>';
  }

  var q = state.configSearch.toLowerCase();
  var baseRows = state.configSearch
    ? state.configRows.filter(function(r){ return r.key.toLowerCase().indexOf(q)>=0 || r.description.toLowerCase().indexOf(q)>=0; })
    : state.configRows.filter(function(r){ return r.section===state.configSection; });

  var rowsHtml = baseRows.map(function(r){
    var val = app.currentConfigValue(r);
    var dirty = Object.prototype.hasOwnProperty.call(state.pendingConfigEdits, r.key);
    var control;
    if (!r.editable) {
      control = '<input class="input mono" style="width:100%;max-width:420px;" value="'+esc(Array.isArray(val)?val.join(', '):val)+'" disabled title="restart required -- not editable here">';
    } else if (r.type==='bool') {
      var toggleBg = val ? 'rgba(34,199,224,.25)' : 'var(--bg-elevated)';
      var knobLeft = val ? '17px' : '2px';
      var knobColor = val ? 'var(--accent)' : 'var(--text-faint)';
      control = '<div class="toggle" style="background:'+toggleBg+';" onclick="app.toggleBool(\''+r.key+'\')"><div class="toggle-knob" style="left:'+knobLeft+';background:'+knobColor+';"></div></div>';
    } else if (r.type==='enum') {
      var opts = (r.options||[]).map(function(v){ return '<option value="'+v+'"'+(v===val?' selected':'')+'>'+v+'</option>'; }).join('');
      control = '<select class="select mono" style="width:220px;" onchange="app.setConfigValue(\''+r.key+'\', this.value)">'+opts+'</select>';
    } else if (r.type==='number') {
      control = '<input class="input mono" style="width:220px;" value="'+esc(val)+'" onchange="app.setConfigValue(\''+r.key+'\', this.value)">';
    } else if (r.type==='list') {
      var chips = (val||[]).map(function(v, idx){
        return '<span class="chip">'+esc(v)+'<button onclick="app.removeListItem(\''+r.key+'\','+idx+')">✕</button></span>';
      }).join('');
      control = '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">'+chips
        + '<input class="input mono" style="width:150px;padding:4px 8px;" placeholder="+ add" onkeydown="if(event.key===\'Enter\'){app.addListItem(\''+r.key+'\', this.value); this.value=\'\';}">'
        + '</div>';
    } else {
      control = '<input class="input mono" style="width:100%;max-width:420px;" value="'+esc(val)+'" onchange="app.setConfigValue(\''+r.key+'\', this.value)">';
    }

    return '<div class="config-row">'
      + '<div class="config-key-col"><div class="config-key"><span>'+r.key+'</span>'
      + (r.restart_required ? '<span class="badge badge-restart">RESTART</span>' : '<span class="badge badge-live">LIVE</span>')
      + (r.overridden ? '<span class="modified-dot" title="overridden"></span>' : '')
      + (dirty ? '<span class="pending-dot" title="unsaved change"></span>' : '')
      + (state.configSearch ? '<span class="tag">'+r.section+'</span>' : '')
      + '</div><div class="config-desc">'+esc(r.description)+'</div></div>'
      + '<div class="config-val-col">'+control
      + '<div class="config-default">suggested: '+esc(Array.isArray(r.suggested_default)?r.suggested_default.join(', '):r.suggested_default)
      + (r.overridden ? ' <span class="icon-btn btn-sm" style="width:auto;padding:1px 7px;height:auto;" onclick="app.resetConfigValue(\''+r.key+'\')">reset</span>' : '')+'</div>'
      + '</div></div>';
  }).join('');
  if (!rowsHtml) rowsHtml = '<div class="empty-state">No keys match “'+esc(state.configSearch)+'”.</div>';

  var pendingCount = Object.keys(state.pendingConfigEdits).length;
  var saveBar = pendingCount
    ? '<div class="save-bar"><span>'+pendingCount+' unsaved change(s) — nothing is applied until you save</span>'
      + '<div style="display:flex;gap:8px;"><button class="btn btn-sm" onclick="app.discardConfigEdits()" '+(state.configSaving?'disabled':'')+'>Discard</button>'
      + '<button class="btn btn-primary btn-sm" onclick="app.saveConfigEdits()" '+(state.configSaving?'disabled':'')+'>'+(state.configSaving?'Saving…':'Save '+pendingCount+' change(s)')+'</button></div></div>'
    : '';

  return ''
    + '<div class="topbar"><div class="topbar-row">'
    + '<div><div class="view-title">Config — config.yaml</div><div class="view-sub">Every LIVE key, grouped as it is on disk. Edits are staged here and only reach the running server — via state/config_overrides.json — when you click Save. RESTART keys show current value but aren\'t editable here.</div></div>'
    + '<div class="search-wrap">'+ICONS.search+'<input id="configSearchInput" class="input search-input" placeholder="Search all keys…" value="'+esc(state.configSearch)+'" oninput="app.onConfigSearch(this.value)"></div>'
    + '</div></div>'
    + '<div class="content" style="padding:0;display:flex;flex-direction:column;">'
    + '<div class="config-body" style="flex:1;min-height:0;">'
    + '<div class="section-nav">'+sectionsHtml+'</div>'
    + '<div class="config-scroll">'+danger+deviceTypeMapHtml+rowsHtml+'</div>'
    + '</div>' + saveBar + '</div>';
}

function renderApp(){
  var view = '';
  if (state.activeView==='devices') view = renderDevicesView();
  else if (state.activeView==='deviceDetail') view = renderDeviceDetailView();
  else if (state.activeView==='hunt') view = renderHuntView();
  else if (state.activeView==='graph') view = renderGraphView();
  else if (state.activeView==='blocking') view = renderBlockingView();
  else if (state.activeView==='suricata') view = renderSuricataView();
  else view = renderConfigView();
  return renderSidebar() + '<div class="main-panel">'+view+'</div>' + renderToasts();
}

function render(){
  var active = document.activeElement;
  var id = (active && active.id) ? active.id : null;
  var selStart = null, selEnd = null;
  if (active && typeof active.selectionStart === 'number') { selStart = active.selectionStart; selEnd = active.selectionEnd; }
  document.getElementById('app').innerHTML = renderApp();
  if (id) {
    var el = document.getElementById(id);
    if (el) {
      el.focus();
      if (selStart !== null) { try { el.setSelectionRange(selStart, selEnd); } catch(e){} }
    }
  }
  if (state.activeView === 'graph') attachGraphInteraction();
}

/* ============================= app actions ============================= */

var app = {
  goView: function(v){
    state.activeView = v;
    render();
    if (v === 'config' && !state.configLoading) loadConfig();
    if (v === 'devices' && !state.devicesLoading && !state.devicesLoaded) loadDevices();
    if (v === 'hunt' && !state.devicesLoading && !state.devicesLoaded) loadDevices();
    if (v === 'graph' && !state.graphLoading && !state.graphLoaded) loadGraph();
    if (v === 'blocking' && !state.blockingLoading) loadBlockingState();
    if (v === 'blocking' && !state.devicesLoading && !state.devicesLoaded) loadDevices();
    if (v === 'suricata' && !state.suricataLoading && !state.suricataLoaded) loadSuricata();
  },
  selectDevice: function(id){
    state.activeView='deviceDetail'; state.selectedDeviceId=id;
    state.topDomainsLoaded=false; state.topDomains=null; state.topDomainsError=null;
    state.newDeviceBlockDomain=''; state.deviceActionBusy=null; state.pendingDeviceType=null;
    render();
    loadDeviceDetail(id);
    loadTopDomains(id);
  },
  backToDevices: function(){ state.activeView='devices'; render(); },
  traceThisDevice: function(){
    state.activeView='hunt'; state.huntMode='history'; state.huntDeviceId=state.selectedDeviceId;
    state.huntSinceDays=''; state.huntRan=false; render();
    runHuntQuery();
  },
  toggleSort: function(table, field){
    var s = state.sort[table];
    if (s.field === field) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
    else { s.field = field; s.dir = 'asc'; }
    render();
  },
  onDeviceSearch: function(v){ state.deviceSearch=v; render(); },
  reloadDevices: function(){ state.devicesLoaded=false; loadDevices(); },
  reloadGraph: function(){ state.graphLoaded=false; loadGraph(); },

  goHuntMode: function(m){ state.huntMode=m; state.huntRan=false; state.huntResult=null; state.huntError=null; render(); },
  runHuntQuery: function(){ runHuntQuery(); },
  onHuntDest: function(v){ state.huntDest=v; render(); },
  onHuntDecisionInput: function(v){ state.huntDecisionId=v; render(); },
  onHuntDevice: function(v){ state.huntDeviceId=v; render(); },
  onHuntSinceDays: function(v){ state.huntSinceDays=v; render(); },

  selectGraphNode: function(id){ state.graphSelected=id; render(); },
  toggleGraphKind: function(k){ state.graphShow[k]=!state.graphShow[k]; render(); },

  changeToken: function(){
    var entered = window.prompt('API token (fritz_api_token / API_SECRET_TOKEN):', getToken());
    if (entered !== null) { setToken(entered.trim()); render(); }
  },
  reloadConfig: function(){ loadConfig(); },
  onConfigSearch: function(v){ state.configSearch=v; render(); },
  setConfigSection: function(s){ state.configSection=s; state.configSearch=''; render(); },

  /* ---- Config tab: staged edits, nothing PATCHes until Save is clicked ---- */
  currentConfigValue: function(row){
    return Object.prototype.hasOwnProperty.call(state.pendingConfigEdits, row.key) ? state.pendingConfigEdits[row.key] : row.value;
  },
  setConfigValue: function(key, rawValue){
    state.pendingConfigEdits[key] = rawValue;
    render();
  },
  toggleBool: function(key){
    var row = state.configRows.filter(function(r){ return r.key===key; })[0];
    app.setConfigValue(key, !app.currentConfigValue(row));
  },
  removeListItem: function(key, idx){
    var row = state.configRows.filter(function(r){ return r.key===key; })[0];
    var arr = app.currentConfigValue(row).slice(); arr.splice(idx, 1);
    app.setConfigValue(key, arr);
  },
  addListItem: function(key, val){
    val = (val||'').trim(); if (!val) return;
    var row = state.configRows.filter(function(r){ return r.key===key; })[0];
    app.setConfigValue(key, app.currentConfigValue(row).concat([val]));
  },
  discardConfigEdits: function(){ state.pendingConfigEdits = {}; render(); },
  saveConfigEdits: async function(){
    var keys = Object.keys(state.pendingConfigEdits);
    if (!keys.length) return;
    state.configSaving = true; render();
    var succeeded = [], failed = [];
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      try {
        await apiFetch('/api/config/' + encodeURIComponent(key), { method: 'PATCH', body: JSON.stringify({ value: state.pendingConfigEdits[key] }) });
        succeeded.push(key);
      } catch (err) {
        failed.push(key + ': ' + (err.message || err));
      }
    }
    succeeded.forEach(function(k){ delete state.pendingConfigEdits[k]; });
    state.configSaving = false;
    await loadConfig();
    if (succeeded.length) showToast('success', '✓ ' + succeeded.length + ' saved and now live (' + new Date().toLocaleTimeString() + ')' + (failed.length ? ' — ' + failed.length + ' failed' : ''));
    if (failed.length) showToast('error', 'Failed to save: ' + failed.join('; '));
    render();
  },
  resetConfigValue: async function(key){
    delete state.pendingConfigEdits[key];
    try {
      await apiFetch('/api/config/' + encodeURIComponent(key), { method: 'DELETE' });
      await loadConfig();
      showToast('success', '✓ ' + key + ' reset to config.yaml baseline');
    } catch (err) { showToast('error', 'Reset failed: ' + err.message); render(); }
  },

  /* ---- device_type_overrides panel (Config tab): staged edits, own Save ---- */
  currentOverrideType: function(o){
    return Object.prototype.hasOwnProperty.call(state.pendingOverrideEdits, o.pattern) ? state.pendingOverrideEdits[o.pattern] : o.type;
  },
  setOverrideType: function(pattern, type){ state.pendingOverrideEdits[pattern] = type; render(); },
  removeOverride: function(pattern){
    state.pendingOverrideRemovals[pattern] = !state.pendingOverrideRemovals[pattern];
    render();
  },
  onNewOverridePattern: function(v){ state.newOverridePattern=v; render(); },
  onNewOverrideType: function(v){ state.newOverrideType=v; render(); },
  addOverride: function(){
    var pattern = state.newOverridePattern.trim();
    if (!pattern) return;
    state.pendingNewOverrides.push({ pattern: pattern, type: state.newOverrideType });
    state.newOverridePattern = '';
    render();
  },
  removePendingNewOverride: function(idx){ state.pendingNewOverrides.splice(idx, 1); render(); },
  discardOverrideEdits: function(){
    state.pendingOverrideEdits = {}; state.pendingOverrideRemovals = {}; state.pendingNewOverrides = [];
    render();
  },
  saveOverrideEdits: async function(){
    var edits = Object.keys(state.pendingOverrideEdits);
    var removals = Object.keys(state.pendingOverrideRemovals).filter(function(p){ return state.pendingOverrideRemovals[p]; });
    var additions = state.pendingNewOverrides.slice();
    if (!edits.length && !removals.length && !additions.length) return;
    state.overridesSaving = true; render();
    var okCount = 0, errs = [];
    for (var i = 0; i < edits.length; i++) {
      var p = edits[i];
      try { await apiFetch('/api/config/device_type_overrides/' + encodeURIComponent(p), { method: 'PATCH', body: JSON.stringify({ type: state.pendingOverrideEdits[p] }) }); okCount++; delete state.pendingOverrideEdits[p]; }
      catch (err) { errs.push(p + ': ' + err.message); }
    }
    for (var j = 0; j < removals.length; j++) {
      var rp = removals[j];
      try { await apiFetch('/api/config/device_type_overrides/' + encodeURIComponent(rp), { method: 'DELETE' }); okCount++; delete state.pendingOverrideRemovals[rp]; }
      catch (err) { errs.push(rp + ': ' + err.message); }
    }
    for (var k = 0; k < additions.length; k++) {
      var add = additions[k];
      try { await apiFetch('/api/config/device_type_overrides/' + encodeURIComponent(add.pattern), { method: 'PATCH', body: JSON.stringify({ type: add.type }) }); okCount++; }
      catch (err) { errs.push(add.pattern + ': ' + err.message); }
    }
    state.pendingNewOverrides = state.pendingNewOverrides.filter(function(a){ return errs.some(function(e){ return e.indexOf(a.pattern+':') === 0; }); });
    state.overridesSaving = false;
    await loadConfig();
    if (okCount) showToast('success', '✓ ' + okCount + ' device-type override(s) saved and now live');
    if (errs.length) showToast('error', 'Failed: ' + errs.join('; '));
    render();
  },

  /* ---- Device Detail page: device-type assignment, staged, own Save ---- */
  stageDeviceType: function(type){ state.pendingDeviceType = type; render(); },
  saveDeviceType: async function(){
    if (state.pendingDeviceType == null || !state.deviceDetail) return;
    state.deviceTypeSaving = true; render();
    try {
      await apiFetch('/api/config/device_type_overrides/' + encodeURIComponent(state.deviceDetail.hostname), { method: 'PATCH', body: JSON.stringify({ type: state.pendingDeviceType }) });
      showToast('success', '✓ device_type saved — now ' + state.pendingDeviceType);
      state.pendingDeviceType = null;
      await loadDeviceDetail(state.deviceDetail.device_id);
    } catch (err) {
      showToast('error', 'Save failed: ' + err.message);
    } finally {
      state.deviceTypeSaving = false; render();
    }
  },
  discardDeviceType: function(){ state.pendingDeviceType = null; render(); },

  /* ---- containment: isolate / tarpit / release (device), block / unblock (domain) ---- */
  isolateRouter: function(deviceId, hostname){
    if (!window.confirm('Isolate ' + hostname + ' via Fritz!Box WAN block? This cuts off its internet access until released.')) return;
    app._runDeviceAction(deviceId, 'isolate_router', '/api/devices/' + encodeURIComponent(deviceId) + '/isolate_router', 'Isolated via Fritz!Box.');
  },
  tarpitDevice: function(deviceId, hostname){
    if (!window.confirm('Tarpit ' + hostname + ' (Layer-2 ARP/NDP)? This blackholes its LAN traffic until released.')) return;
    app._runDeviceAction(deviceId, 'tarpit', '/api/devices/' + encodeURIComponent(deviceId) + '/tarpit', 'Tarpitted.');
  },
  releaseDevice: function(deviceId, hostname){
    if (!window.confirm('Release ' + hostname + ' from all containment (Fritz!Box isolation, tarpit, and any blocked domains)?')) return;
    app._runDeviceAction(deviceId, 'release', '/api/devices/' + encodeURIComponent(deviceId) + '/release', 'Released.', 'POST', {});
  },
  _runDeviceAction: async function(deviceId, actionName, path, successMsg, method, body){
    state.deviceActionBusy = actionName; render();
    try {
      await apiFetch(path, { method: method || 'POST', body: JSON.stringify(body || {}) });
      showToast('success', '✓ ' + successMsg);
      if (state.deviceDetail && state.deviceDetail.device_id === deviceId) await loadDeviceDetail(deviceId);
      if (state.devicesLoaded) await loadDevices();
      if (state.blockingLoaded) await loadBlockingState();
    } catch (err) {
      showToast('error', 'Action failed: ' + err.message);
    } finally {
      state.deviceActionBusy = null; render();
    }
  },
  onNewDeviceBlockDomain: function(v){ state.newDeviceBlockDomain = v; render(); },
  blockDomainForDevice: async function(deviceId){
    var domain = (state.newDeviceBlockDomain || '').trim();
    if (!domain) return;
    state.deviceActionBusy = 'block_domain'; render();
    try {
      await apiFetch('/api/domains/block', { method: 'POST', body: JSON.stringify({ domain: domain, device_id: deviceId }) });
      showToast('success', '✓ blocked ' + domain);
      state.newDeviceBlockDomain = '';
      await loadDeviceDetail(deviceId);
      if (state.blockingLoaded) await loadBlockingState();
    } catch (err) {
      showToast('error', 'Block failed: ' + err.message);
    } finally {
      state.deviceActionBusy = null; render();
    }
  },
  unblockDomain: async function(domain, deviceIdToRefresh){
    if (!window.confirm('Unblock ' + domain + '?')) return;
    state.deviceActionBusy = 'unblock:' + domain; render();
    try {
      await apiFetch('/api/domains/unblock', { method: 'POST', body: JSON.stringify({ domain: domain }) });
      showToast('success', '✓ unblocked ' + domain);
      if (deviceIdToRefresh) await loadDeviceDetail(deviceIdToRefresh);
      if (state.blockingLoaded) await loadBlockingState();
    } catch (err) {
      showToast('error', 'Unblock failed: ' + err.message);
    } finally {
      state.deviceActionBusy = null; render();
    }
  },

  /* ---- Blocking view (global) ---- */
  reloadBlocking: function(){ loadBlockingState(); },
  onNewBlockDomain: function(v){ state.newBlockDomain = v; render(); },
  onNewBlockDeviceId: function(v){ state.newBlockDeviceId = v; render(); },
  onNewBlockReason: function(v){ state.newBlockReason = v; render(); },
  submitBlockDomain: async function(){
    var domain = state.newBlockDomain.trim();
    if (!domain) return;
    try {
      await apiFetch('/api/domains/block', { method: 'POST', body: JSON.stringify({
        domain: domain, device_id: state.newBlockDeviceId || null, reason: state.newBlockReason || null,
      }) });
      showToast('success', '✓ blocked ' + domain);
      state.newBlockDomain = ''; state.newBlockReason = '';
      await loadBlockingState();
    } catch (err) { showToast('error', 'Block failed: ' + err.message); render(); }
  },

  /* ---- Suricata view ---- */
  reloadSuricata: function(){ loadSuricata(); },

  /* ---- Evidence Graph: pan/zoom/drag/group-select ---- */
  graphZoomBy: function(factor){
    state.graphZoom = Math.max(0.06, Math.min(3, state.graphZoom * factor));
    render();
  },
  graphResetView: function(){ state.graphPan = { x: 0, y: 0 }; state.graphZoom = 1; render(); },
  graphFitToView: function(){ state.graphFitPending = true; render(); },
  graphClearSelection: function(){ state.graphMultiSelected = {}; render(); },
};

render();
if (state.activeView === 'config') loadConfig();
if (state.activeView === 'devices') loadDevices();
if (state.activeView === 'graph') loadGraph();
</script>
</body>
</html>
