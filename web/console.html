<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home-IDS Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#12141a; --bg-panel:#181b22; --bg-elevated:#1f232c; --bg-hover:#232833;
    --border:#2a2f3b; --border-soft:#22262f;
    --text:#e7e9ee; --text-dim:#a2a9b8; --text-faint:#6b7280;
    --accent:#22c7e0; --accent-dim:#1a4d57;
    --sev-benign:#3fbf7f; --sev-anomalous:#5aa7f0; --sev-suspicious:#e0b23f; --sev-high:#e0813f; --sev-critical:#e0523f;
    --danger-bg:#2a1d18; --danger-border:#5a3a26;
    --font-sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:5px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);}
  a{color:var(--accent);text-decoration:none;} a:hover{color:#6fdcee;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-panel);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
  #app{display:flex;width:100%;height:100vh;background:var(--bg);overflow:hidden;}
  button, select, input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .sidebar{width:216px;flex:0 0 216px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--border-soft);}
  .brand-name{font-size:14px;font-weight:600;letter-spacing:.02em;}
  .brand-sub{font-size:11px;color:var(--text-faint);margin-top:2px;font-family:var(--font-mono);}
  .nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);font-size:13px;color:var(--text-dim);cursor:pointer;border:1px solid transparent;}
  .nav-item:hover{background:var(--bg-hover);color:var(--text);}
  .nav-item.active{background:var(--bg-elevated);color:var(--text);border-color:var(--border);}
  .nav-item.active svg{color:var(--accent);}
  .nav-item svg{width:16px;height:16px;flex:0 0 16px;color:var(--text-faint);}
  .sidebar-foot{padding:12px 16px 16px;border-top:1px solid var(--border-soft);}
  .status-row{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--sev-benign);flex:0 0 6px;box-shadow:0 0 0 3px rgba(63,191,127,.15);}
  .status-line2{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);margin-top:4px;padding-left:14px;}
  .status-line2.link{cursor:pointer;text-decoration:underline;}

  .main-panel{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
  .topbar{padding:18px 28px 14px;border-bottom:1px solid var(--border-soft);flex:0 0 auto;}
  .topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .view-title{font-size:17px;font-weight:600;}
  .view-sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;max-width:640px;line-height:1.5;}
  .content{flex:1;overflow-y:auto;padding:20px 28px 40px;}


  .input, .select{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);font-size:12.5px;border-radius:var(--radius);padding:7px 10px;outline:none;}
  .input:focus,.select:focus{border-color:var(--accent);}
  .mono{font-family:var(--font-mono);}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-weight:500;border-radius:var(--radius);padding:7px 12px;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--bg-hover);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#08272c;}
  .btn-primary:hover{background:#3ed4ec;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);padding:6px 8px;}
  .btn-ghost:hover{background:var(--bg-hover);color:var(--text);}
  .btn-sm{padding:5px 9px;font-size:11.5px;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-faint);cursor:pointer;}
  .icon-btn:hover{color:var(--text);background:var(--bg-hover);}
  .icon-btn svg{width:13px;height:13px;}
  .icon-btn:disabled, .input:disabled, .select:disabled{opacity:.5;cursor:not-allowed;}

  .badge{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:3px;border:1px solid var(--border);color:var(--text-faint);}
  .badge-live{color:var(--sev-benign);border-color:rgba(63,191,127,.35);background:rgba(63,191,127,.08);}
  .badge-restart{color:var(--sev-suspicious);border-color:rgba(224,178,63,.35);background:rgba(224,178,63,.08);}
  .badge-pending{color:var(--accent);border-color:var(--accent-dim);}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:11px;border:1px solid;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:11px;}
  .chip button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:11px;padding:0;line-height:1;}
  .chip button:hover{color:var(--sev-critical);}
  .tag{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);border:1px solid var(--border);padding:1px 5px;border-radius:3px;}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}

  .panel{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;}
  .panel-header{padding:12px 16px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .panel-title{font-size:12.5px;font-weight:600;}
  .panel-body{padding:14px 16px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border-soft);cursor:pointer;white-space:nowrap;}
  th:hover{color:var(--text-dim);}
  td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-clickable{cursor:pointer;}
  tr.row-clickable:hover td{background:var(--bg-hover);}
  .cell-mono{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .cell-title{font-weight:500;}
  .table-wrap{overflow-x:auto;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .row{display:flex;align-items:center;}
  .toggle{width:34px;height:19px;border-radius:10px;border:1px solid var(--border);position:relative;cursor:pointer;flex:0 0 34px;}
  .toggle-knob{position:absolute;top:2px;width:13px;height:13px;border-radius:50%;transition:left .12s;}

  .kv-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-key{width:170px;flex:0 0 170px;color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;padding-top:2px;}
  .kv-val{flex:1;min-width:0;}

  .config-body{display:flex;height:100%;}
  .section-nav{width:190px;flex:0 0 190px;border-right:1px solid var(--border-soft);padding:10px;overflow-y:auto;}
  .section-item{padding:8px 10px;font-size:12px;border-radius:var(--radius);color:var(--text-dim);cursor:pointer;margin-bottom:1px;}
  .section-item:hover{background:var(--bg-hover);}
  .section-item.active{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);}
  .section-item.danger{color:var(--sev-high);}
  .config-scroll{flex:1;overflow-y:auto;padding:18px 24px;}

  .config-row{padding:13px 0;border-bottom:1px solid var(--border-soft);display:flex;gap:18px;}
  .config-row:last-child{border-bottom:none;}
  .config-key-col{width:300px;flex:0 0 300px;min-width:0;}
  .config-key{font-family:var(--font-mono);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .config-desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;margin-top:4px;}
  .config-val-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .config-default{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);display:flex;align-items:center;gap:6px;}
  .modified-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px;}

  .danger-banner{background:var(--danger-bg);border:1px solid var(--danger-border);color:#e0a582;font-size:11.5px;padding:10px 14px;border-radius:6px;margin-bottom:16px;line-height:1.5;}
  .error-banner{background:var(--danger-bg);border:1px solid var(--danger-border);color:#e0a582;font-size:12.5px;padding:12px 16px;border-radius:6px;margin-bottom:16px;line-height:1.6;}
  .error-banner button{margin-top:8px;}

  .timeline{position:relative;padding-left:22px;}
  .timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--border);}
  .tl-item{position:relative;margin-bottom:12px;}
  .tl-item:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bg-panel);border:2px solid var(--accent);}
  .tl-card{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;padding:11px 13px;}
  .tl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .tl-type{font-size:12px;font-weight:600;}
  .tl-time{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .tl-body{font-size:12px;color:var(--text-dim);line-height:1.5;}

  .mode-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .mode-tab{padding:8px 14px;font-size:12.5px;font-weight:500;border-radius:6px;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;background:var(--bg-elevated);}
  .mode-tab.active{color:var(--text);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}

  .empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:12.5px;}

  .graph-wrap{display:flex;height:600px;gap:16px;}
  .graph-canvas{flex:1;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;position:relative;overflow:hidden;}
  .graph-legend{position:absolute;top:12px;left:12px;background:rgba(24,27,34,.9);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:11px;display:flex;flex-direction:column;gap:6px;z-index:2;}
  .legend-row{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .legend-check{width:12px;height:12px;border-radius:3px;border:1px solid var(--border);flex:0 0 12px;}
  .graph-drawer{width:280px;flex:0 0 280px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;padding:16px;overflow-y:auto;}
  .node-label{font-size:9.5px;fill:var(--text-dim);font-family:var(--font-sans);}
  .node-sub{font-size:8.5px;fill:var(--text-faint);font-family:var(--font-mono);}

  .search-wrap{position:relative;flex:0 0 auto;}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text-faint);pointer-events:none;}
  .search-input{padding-left:28px;width:220px;}

  /* ---- toasts ---- */
  .toast-stack{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:360px;}
  .toast{padding:10px 14px;border-radius:6px;font-size:12.5px;line-height:1.5;border:1px solid;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .toast-success{background:rgba(63,191,127,.14);border-color:rgba(63,191,127,.4);color:#bdf0d4;}
  .toast-error{background:var(--danger-bg);border-color:var(--danger-border);color:#e0a582;}

  /* ---- staged-edit save bar ---- */
  .save-bar{position:sticky;bottom:0;left:0;right:0;background:var(--bg-elevated);border-top:1px solid var(--accent-dim);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5;}
  .save-bar span{font-size:12px;color:var(--text-dim);}
  .pending-dot{width:6px;height:6px;border-radius:50%;background:var(--sev-suspicious);flex:0 0 6px;display:inline-block;margin-left:6px;}

  /* ---- containment / blocking ---- */
  .containment-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid;white-space:nowrap;}
  .containment-none{color:var(--text-faint);border-color:var(--border);}
  .containment-active{color:var(--sev-critical);border-color:rgba(224,82,63,.4);background:rgba(224,82,63,.1);}
  .action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .btn-danger{border-color:rgba(224,82,63,.45);color:#e0a58a;}
  .btn-danger:hover{background:rgba(224,82,63,.12);}

  /* ---- evidence graph: pan/zoom/drag ---- */
  .graph-canvas{cursor:grab;}
  .graph-canvas.panning{cursor:grabbing;}
  .graph-canvas svg g.node-group{cursor:pointer;}
  .graph-canvas svg g.node-group.dragging{cursor:grabbing;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= constant data (sample, non-config tabs) ============================= */

var SEV_HEX = { BENIGN:'#3fbf7f', ANOMALOUS:'#5aa7f0', SUSPICIOUS:'#e0b23f', HIGH:'#e0813f', CRITICAL:'#e0523f', UNKNOWN:'#6b7280' };
function sevColor(s){ return SEV_HEX[s] || SEV_HEX.UNKNOWN; }
function hexA(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
// Deterministic color for evidence.independence_family (2026-09-22): same
// string always maps to the same color within a session/across reloads (a
// simple string hash, not randomness), so the graph's own color-coding stays
// consistent without a hardcoded family->color table to maintain.
var FAMILY_PALETTE = ['#5aa7f0','#e0b23f','#9e6ee0','#4fbf7f','#e0743f','#22c7e0','#e0523f','#c78de0','#8bc34a','#f06ea3'];
function familyColor(family){
  var s = String(family || 'unknown');
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return FAMILY_PALETTE[h % FAMILY_PALETTE.length];
}
function sevBorder(s){ return hexA(sevColor(s), 0.45); }
function sevBg(s){ return hexA(sevColor(s), 0.12); }
function tierColor(t){
  if (t === 'known-safe') return SEV_HEX.BENIGN;
  if (t === 'suspicious') return SEV_HEX.SUSPICIOUS;
  if (t === 'malicious') return SEV_HEX.CRITICAL;
  return '#6b7280';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var _toastId = 0;
function showToast(kind, message, ms){
  var id = ++_toastId;
  state.toasts.push({ id: id, kind: kind, message: message });
  render();
  setTimeout(function(){
    state.toasts = state.toasts.filter(function(t){ return t.id !== id; });
    render();
  }, ms || 5000);
}
function renderToasts(){
  if (!state.toasts.length) return '';
  return '<div class="toast-stack">' + state.toasts.map(function(t){
    return '<div class="toast toast-'+(t.kind==='error'?'error':'success')+'">'+esc(t.message)+'</div>';
  }).join('') + '</div>';
}
function sevPill(state){
  return '<span class="pill" style="color:'+sevColor(state)+';border-color:'+sevBorder(state)+';background:'+sevBg(state)+'">'
    + '<span class="dot" style="background:'+sevColor(state)+'"></span>'+state+'</span>';
}

var FALLBACK_DEVICE_TYPES = ['laptop','desktop','phone','tablet','smart_tv','gaming_console','printer','nas','iot','camera','server','unknown','dns_server','router','gateway'];

var GRAPH_LEGEND_DEFS = [
  { kind:'device', label:'Device', color:'#5aa7f0', bg:'rgba(90,167,240,.3)' },
  { kind:'evidence', label:'Evidence', color:'#8b93a3', bg:'rgba(139,147,163,.25)' },
  { kind:'destination', label:'Destination', color:'#9e6ee0', bg:'rgba(158,110,224,.3)' },
  { kind:'decision', label:'Decision', color:'#e0b23f', bg:'rgba(224,178,63,.3)' },
  { kind:'alert_event', label:'Alert', color:'#e0743f', bg:'rgba(224,116,63,.3)' },
  { kind:'explanation', label:'Explanation', color:'#2dc5b2', bg:'rgba(45,197,178,.25)' }
];

// Per-status coloring for alert_event nodes (matches alertStatusPill's palette,
// defined further below in the alerts-table code) -- one legend swatch above
// ('Alert', a single orange), but the actual node fill on the canvas still
// distinguishes fired/suppressed/logged-only, same as decision nodes already
// vary by severity color under one 'Decision' legend entry.
var ALERT_EVENT_NODE_COLORS = {
  FIRED: '#e0743f', SUPPRESSED_AUTONOMOUS: '#8b93a3', LOGGED_ONLY: '#5aa7f0'
};

var ICONS = {
  devices:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20h8M12 16v4"></path></svg>',
  hunt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-5.5-5.5"></path></svg>',
  graph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="2.4"></circle><circle cx="18" cy="6" r="2.4"></circle><circle cx="12" cy="18" r="2.4"></circle><path d="M8 7.3L11 16M16 7.3L13 16M8.4 6h7.2"></path></svg>',
  config:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 13.5a7.4 7.4 0 000-3l1.9-1.4-2-3.4-2.2.9a7.6 7.6 0 00-2.6-1.5L14.1 3h-4l-.4 2.1a7.6 7.6 0 00-2.6 1.5l-2.2-.9-2 3.4L4.6 10.5a7.4 7.4 0 000 3L2.7 15l2 3.4 2.2-.9c.75.65 1.63 1.16 2.6 1.5L10 22h4l.4-2.1a7.6 7.6 0 002.6-1.5l2.2.9 2-3.4z"></path></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-5.5-5.5"></path></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>',
  blocking:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="10" rx="1.5"></rect><path d="M8 10V7a4 4 0 018 0v3"></path></svg>',
  suricata:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 12L18 8M12 3.5v3M12 20.5v-3M3.5 12h3M20.5 12h-3"></path></svg>',
  health:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2-7 4 14 2-7h6"></path></svg>',
  autonomy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 6h14M5 12h14M5 18h14"></path><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"></circle><circle cx="10" cy="18" r="2" fill="currentColor" stroke="none"></circle></svg>',
  overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="8" height="8" rx="1.3"></rect><rect x="13" y="3" width="8" height="5" rx="1.3"></rect><rect x="13" y="10" width="8" height="11" rx="1.3"></rect><rect x="3" y="13" width="8" height="8" rx="1.3"></rect></svg>'
};

/* ============================= mutable state ============================= */

var state = {
  activeView: 'devices',
  selectedDeviceId: null,
  deviceSearch: '',
  sort: {

function getToken(){ return localStorage.getItem('idsApiToken') || ''; }
function setToken(t){ if (t) localStorage.setItem('idsApiToken', t); else localStorage.removeItem('idsApiToken'); }

async function apiFetch(path, options){
  options = options || {};
  var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  var token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  var resp = await fetch(path, Object.assign({}, options, { headers: headers }));
  if (resp.status === 403) {
    var entered = window.prompt('This server requires an API token for requests from another device (the same fritz_api_token / API_SECRET_TOKEN your Fritz!Box/Pi-hole integrations already use). Enter it once — it is remembered in this browser only:');
    if (entered) {
      setToken(entered.trim());
      headers['Authorization'] = 'Bearer ' + entered.trim();
      resp = await fetch(path, Object.assign({}, options, { headers: headers }));
    }
  }
  if (!resp.ok) {
    var detail = '';
    try { var body = await resp.json(); detail = body.detail || JSON.stringify(body); } catch (e) { detail = resp.statusText; }
    throw new Error('HTTP ' + resp.status + ': ' + detail);
  }
  return resp.json();
}

// Strict columnar layout: one fixed x per node kind, stacked top-to-bottom with a
// guaranteed minimum gap so nodes never overlap regardless of graph size. Replaces
// an earlier force-directed relaxation (mutual repulsion + edge springs + a weak
// pull back toward the column) that was meant to declutter the graph organically,
// but let x drift nodes across column boundaries and let y collide within a
// column on any but the smallest graphs -- exactly the "everything is just
// overlapped" complaint this replaces. Ordering within each column is not
// arbitrary: devices sort alphabetically (the "spine" every other column aligns
// to), and evidence/decisions sort by their OWN device's position in that spine
// first, then newest-first -- so a device's evidence and decisions land on
// nearby rows instead of scattered across the whole column, keeping edges short
// and mostly horizontal instead of criss-crossing the whole canvas.
function computeGraphLayout(nodes, edges){
  var colX = { device: 110, evidence: 460, destination: 980, decision: 1400, alert_event: 1820, explanation: 2260 };
  var radius = { decision: 11, device: 12, destination: 10, evidence: 7, alert_event: 10, explanation: 9 };
  // Minimum gap between adjacent circle EDGES in the same column (not centers) --
  // sized to clear the two-line label ("type" + "sub", drawn beside the node, see
  // renderGraphView) so labels don't overlap between one row and the next even
  // when node radius alone wouldn't need that much room. Evidence rows can run
  // into the hundreds, so they're deliberately the tightest packing.
  var minGap = { decision: 22, device: 22, destination: 22, evidence: 14, alert_event: 22, explanation: 26 };

  var byKind = { device: [], evidence: [], destination: [], decision: [], alert_event: [], explanation: [] };
  nodes.forEach(function(n){ (byKind[n.kind] || (byKind[n.kind] = [])).push(n); });

  byKind.device.sort(function(a,b){ return (a.label||'').localeCompare(b.label||''); });
  var deviceOrder = {};
  byKind.device.forEach(function(d, i){ deviceOrder[d.sub || d.id] = i; }); // device node's own id lives in .sub

  if (byKind.destination) byKind.destination.sort(function(a,b){ return (a.label||'').localeCompare(b.label||''); });

  function byDeviceThenRecency(a, b){
    var da = deviceOrder[a.device_id] != null ? deviceOrder[a.device_id] : 999999;
    var db = deviceOrder[b.device_id] != null ? deviceOrder[b.device_id] : 999999;
    if (da !== db) return da - db;
    return (b.timestamp||0) - (a.timestamp||0);
  }
  if (byKind.evidence) byKind.evidence.sort(byDeviceThenRecency);
  if (byKind.decision) byKind.decision.sort(byDeviceThenRecency);
  if (byKind.alert_event) byKind.alert_event.sort(byDeviceThenRecency);
  if (byKind.explanation) byKind.explanation.sort(byDeviceThenRecency);

  var byId = {};
  var laidOut = [];
  Object.keys(colX).forEach(function(kind){
    var seedX = colX[kind];
    var r = radius[kind] || 9;
    var rowH = r*2 + (minGap[kind] || 18);
    var y = 40;
    (byKind[kind] || []).forEach(function(n){
      y += rowH/2;
      var out = Object.assign({}, n, { x: seedX, y: y, r: r });
      if (n.kind === 'decision') { out.fill = hexA(sevColor(n.label), 0.85); out.stroke = sevColor(n.label); }
      else if (n.kind === 'device') { out.fill = 'rgba(90,167,240,.3)'; out.stroke = '#5aa7f0'; }
      else if (n.kind === 'destination') { out.fill = 'rgba(155,110,224,.25)'; out.stroke = '#9e6ee0'; }
      else if (n.kind === 'alert_event') {
        var ac = ALERT_EVENT_NODE_COLORS[n.label] || ALERT_EVENT_NODE_COLORS.LOGGED_ONLY;
        out.fill = hexA(ac, 0.85); out.stroke = ac;
      }
      else if (n.kind === 'explanation') { out.fill = 'rgba(45,197,178,.25)'; out.stroke = '#2dc5b2'; }
      else if (n.kind === 'evidence') {
        // Color-coded by independence_family (2026-09-22, user request:
        // "color code each node with type") -- was uniform gray for every
        // evidence node regardless of what kind of signal it was, the one
        // node kind that hadn't gotten this treatment yet (device/decision/
        // destination/alert_event/explanation all already vary by their own
        // meaningful sub-type). Deterministic hash over the family name
        // instead of a hardcoded per-family table -- automatically covers a
        // family name added later without a console code change.
        var fc = familyColor(n.sub);
        out.fill = hexA(fc, 0.28); out.stroke = fc;
      }
      else { out.fill = 'rgba(226,229,235,.18)'; out.stroke = '#8b93a3'; }
      byId[n.id] = out;
      laidOut.push(out);
      y += rowH/2;
    });
  });

  var laidOutEdges = edges.map(function(e){
    var relColor = { observed:'#4a5568', targets:'#5a6478', supports:'#22c7e0', contradicts:'#e0523f', raised:'#e0743f', explains:'#2dc5b2' };
    return Object.assign({}, e, { stroke: relColor[e.relation] || '#6b7280', dash: e.relation==='contradicts' ? '4,3' : '' });
  });

  return { nodes: laidOut, edges: laidOutEdges, byId: byId };
}

async function loadGraph(){
  state.graphLoading = true; state.graphLoadError = null; render();

    state.graphEdges = laid.edges;

/* ============================= generic table sorting (every table, every column) ============================= */

function sortRows(rows, sort, getters){
  var field = sort.field, dir = sort.dir === 'asc' ? 1 : -1;
  var getter = (getters && getters[field]) || function(r){ return r[field]; };
  var copy = rows.slice();
  copy.sort(function(a,b){
    var av = getter(a), bv = getter(b);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string' && typeof bv === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return -1*dir;
    if (av > bv) return 1*dir;
    return 0;
  });
  return copy;
}
function sortArrow(table, field){
  var s = state.sort[table];
  return s.field===field ? (s.dir==='asc' ? ' ▲' : ' ▼') : '';
}
function sortableTh(table, field, label, extraAttrs){
  return '<th'+(extraAttrs||'')+' onclick="app.toggleSort(\''+table+'\',\''+field+'\')">'+label+sortArrow(table, field)+'</th>';
}

    var containment = c.tarpitted || c.router_isolated
      ? '<span class="containment-pill containment-active">🔒 '+(c.tarpitted && c.router_isolated ? 'Tarpit + Fritz!Box' : c.tarpitted ? 'Tarpit' : 'Fritz!Box')+'</span>'
      : (c.blocked_domain_count ? '<span class="containment-pill containment-none">'+c.blocked_domain_count+' domain(s) blocked</span>' : '<span class="containment-pill containment-none">🔓</span>');
    return '<tr class="row-clickable" onclick="app.selectDevice(\''+d.device_id+'\')">'
      + '<td><div class="cell-title">'+esc(d.hostname)+'</div><div class="cell-mono">'+d.device_id+'</div></td>'
      + '<td><span class="tag">'+esc(d.device_type)+'</span></td>'
      + '<td class="cell-mono">'+esc(d.ip||'—')+'</td>'
      + '<td class="cell-mono">'+esc(macShort)+'</td>'
      + '<td>'+(d.state ? sevPill(d.state) : '<span class="tag">not yet evaluated</span>')+'</td>'
      + '<td>'+containment+'</td>'
      + '<td class="cell-mono">'+fmtTime(d.last_seen)+'</td>'
      + '<td class="cell-mono">'+(d.risk_score != null ? d.risk_score : '—')+'</td>'
      + '<td><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();app.selectDevice(\''+d.device_id+'\')">Open →</button></td>'
      + '</tr>';
  }).join('');
  if (!rows) rows = '<tr><td colspan="9"><div class="empty-state">No devices match “'+esc(state.deviceSearch)+'”.</div></td></tr>';
  return topbarHead
    + '<div class="content"><div class="panel"><div class="table-wrap"><table><thead><tr>'
    + sortableTh('devices','hostname','Device')
    + sortableTh('devices','device_type','Type')
    + sortableTh('devices','ip','IP')
    + sortableTh('devices','mac','MAC',' class="cell-mono"')
    + sortableTh('devices','state','State')
    + sortableTh('devices','containment','Containment')
    + sortableTh('devices','last_seen','Last seen')
    + sortableTh('devices','risk_score','Risk')
    + '<th></th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table></div></div></div>';
}

            + '<td><button class="btn btn-ghost btn-sm" '+(busy==='unblock:'+b.domain?'disabled':'')+' onclick="app.unblockDomain(\''+esc(b.domain)+'\', \''+d.device_id+'\')">Unblock</button></td></tr>';

      + '<div style="font-size:11px;color:var(--text-faint);margin-top:8px;">'+esc(state.topDomains.note||'')+'</div>';
  } else {
    topDomainsHtml = '<div class="empty-state" style="padding:20px;">'+esc(d.top_domains_note||'')+'</div>';

  return ''
    + '<div class="topbar"><div class="topbar-row"><div>'

    + '<div class="view-sub">First seen '+(d.first_seen ? fmtTime(d.first_seen) : '—')+' · last seen '+fmtTime(d.last_seen)+' · '+(d.state ? sevPill(d.state) : '<span class="tag">not yet evaluated</span>')+'</div>'

    + '<div class="kv-row"><div class="kv-key">source</div><div class="kv-val">'+sourceBadge+'</div></div>'
    + '<div class="kv-row"><div class="kv-key">matches by</div><div class="kv-val" style="color:var(--text-dim);">hostname substring, first match in file order -- see Config → network_and_devices, saved as pattern "'+esc(d.hostname)+'"</div></div>'
    + '</div></div>'
    + '<div class="panel"><div class="panel-header"><div class="panel-title">Identity fingerprint — all known identities</div></div><div class="panel-body">'
    + '<div class="kv-row"><div class="kv-key">MAC address</div><div class="kv-val cell-mono">'+esc(d.mac_address)+'</div></div>'
    + '<div class="kv-row"><div class="kv-key">known_ips ('+(d.known_ips||[]).length+'/8)</div><div class="kv-val" style="display:flex;flex-wrap:wrap;gap:6px;">'+knownIps+'</div></div>'
    + '<div class="kv-row"><div class="kv-key">ja4_seen ('+(d.ja4_seen||[]).length+'/50)</div><div class="kv-val stack" style="display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;">'+ja4+'</div></div>'
    + '<div class="kv-row"><div class="kv-key">dhcp_fingerprint</div><div class="kv-val cell-mono" style="font-size:11px;color:var(--text-dim);">'+(d.dhcp_fingerprint ? esc(JSON.stringify(d.dhcp_fingerprint)) : '—')+'</div></div>'
    + '<div class="kv-row"><div class="kv-key">re-identification</div><div class="kv-val">'+merges+'</div></div>'
    + '<div class="kv-row"><div class="kv-key">confirmed_threat_count</div><div class="kv-val cell-mono">'+d.confirmed_threat_count+'</div></div>'
    + '</div></div>'
    + '</div>'
    + '<div class="panel" style="margin-top:14px;"><div class="panel-header"><div class="panel-title">Containment</div>'+containmentPills+'</div>'
    + '<div class="panel-body">'
    + '<div class="action-row">'
    + '<button class="btn btn-danger btn-sm" '+(busy?'disabled':'')+' onclick="app.isolateRouter(\''+d.device_id+'\', \''+esc(d.hostname)+'\')">Isolate via Fritz!Box</button>'
    + '<button class="btn btn-danger btn-sm" '+(busy?'disabled':'')+' onclick="app.tarpitDevice(\''+d.device_id+'\', \''+esc(d.hostname)+'\')">Tarpit (Layer-2)</button>'

    + '</div></div></div>'

}

function renderHuntView(){
  var modeDefs = [['touching','Devices touching X'],['timeline','Decision timeline'],['history','Device history'],['replay','Replay decision']];
  var tabs = modeDefs.map(function(m){
    return '<div class="mode-tab'+(state.huntMode===m[0]?' active':'')+'" onclick="app.goHuntMode(\''+m[0]+'\')">'+m[1]+'</div>';
  }).join('');

  var deviceOpts = '<option value="">— select a device —</option>' + state.devices.map(function(d){
    return '<option value="'+d.device_id+'"'+(d.device_id===state.huntDeviceId?' selected':'')+'>'+esc(d.hostname)+'</option>';
  }).join('');

  var formHtml = '';
  if (state.huntMode==='touching') {
    formHtml = '<div class="row" style="gap:10px;"><span style="font-size:12px;color:var(--text-dim);">devices_touching(</span>'
      + '<input class="input mono" style="flex:1;" placeholder="destination — domain or IP substring, e.g. 203.0.113" value="'+esc(state.huntDest)+'" onchange="app.onHuntDest(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">, since_days=</span>'
      + '<input class="input mono" style="width:70px;" placeholder="all" value="'+esc(state.huntSinceDays)+'" onchange="app.onHuntSinceDays(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">)</span><button class="btn btn-primary" onclick="app.runHuntQuery()">Run</button></div>';
  } else if (state.huntMode==='timeline') {
    formHtml = '<div class="row" style="gap:10px;"><span style="font-size:12px;color:var(--text-dim);">decision_timeline(</span>'
      + '<input class="input mono" style="flex:1;" placeholder="decision_id — from the Evidence Graph tab or a device\'s history" value="'+esc(state.huntDecisionId)+'" onchange="app.onHuntDecisionInput(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">)</span><button class="btn btn-primary" onclick="app.runHuntQuery()">Run</button></div>';
  } else if (state.huntMode==='history') {
    formHtml = '<div class="row" style="gap:10px;"><span style="font-size:12px;color:var(--text-dim);">device_history(</span>'
      + '<select class="select mono" style="flex:1;" onchange="app.onHuntDevice(this.value)">'+deviceOpts+'</select>'
      + '<span style="font-size:12px;color:var(--text-dim);">, since_days=</span>'
      + '<input class="input mono" style="width:70px;" placeholder="all" value="'+esc(state.huntSinceDays)+'" onchange="app.onHuntSinceDays(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">)</span><button class="btn btn-primary" onclick="app.runHuntQuery()">Run</button></div>';
  } else {
    formHtml = '<div class="row" style="gap:10px;"><span style="font-size:12px;color:var(--text-dim);">replay_decision(</span>'
      + '<input class="input mono" style="flex:1;" placeholder="decision_id" value="'+esc(state.huntDecisionId)+'" onchange="app.onHuntDecisionInput(this.value)">'
      + '<span style="font-size:12px;color:var(--text-dim);">)</span><button class="btn btn-primary" onclick="app.runHuntQuery()">Replay against current engine</button></div>';
  }

  var resultsHtml = '';
  if (state.huntError) {
    resultsHtml = '<div class="error-banner">'+esc(state.huntError)+'</div>';
  } else if (state.huntLoading) {
    resultsHtml = '<div class="panel"><div class="panel-body"><div class="empty-state">Running query…</div></div></div>';
  } else if (state.huntRan && state.huntResult) {
    var r = state.huntResult;
    var body = '';
    if (state.huntMode==='touching') {
      if (!r.devices.length) {
        body = '<div class="empty-state">No device evidence references "'+esc(r.destination_query)+'"'+(r.matched_destinations.length ? '' : ' — no destination in the graph matches that text at all.')+'</div>';
      } else {
        var trs = r.devices.map(function(dv){
          return '<tr><td><div class="cell-title">'+esc(dv.hostname)+'</div><div class="cell-mono">'+dv.device_id+'</div></td>'
            + '<td><button class="btn btn-ghost btn-sm" onclick="app.selectDevice(\''+dv.device_id+'\')">Open device →</button></td></tr>';
        }).join('');
        body = '<div style="font-size:11.5px;color:var(--text-dim);margin-bottom:10px;">Matched destination(s): '+r.matched_destinations.map(function(x){ return '<span class="tag">'+esc(x)+'</span>'; }).join(' ')+'</div>'
          + '<div class="table-wrap"><table><thead><tr><th>Device</th><th></th></tr></thead><tbody>'+trs+'</tbody></table></div>';
      }
    } else if (state.huntMode==='timeline') {
      var dec = r.decision;
      var items = r.evidence.map(function(e){
        return '<div class="tl-item"><div class="tl-card"><div class="tl-head"><span class="tl-type" title="'+esc(e.evidence_type)+'">'+esc(e.type_label || e.evidence_type)+'</span><span class="tl-time">'+fmtTime(e.timestamp)+'</span></div>'
          + '<div class="tl-body">'+(e.type_description ? esc(e.type_description)+'<br>' : '')+(e.destination_id !== '(none)' ? 'target: '+esc(e.destination_id)+' · ' : '') +'confidence '+e.confidence+' · source '+esc(e.source)+' · family '+esc(e.independence_family)+'</div></div></div>';
      }).join('');
      var decExplanation = dec.explanation_label || (dec.raw_payload && dec.raw_payload.explanation) || '—';
      items += '<div class="tl-item"><div class="tl-card" style="border-color:'+sevColor(dec.state)+';"><div class="tl-head"><span class="tl-type" style="color:'+sevColor(dec.state)+'">DECISION — '+dec.state+'</span><span class="tl-time">'+fmtTime(dec.timestamp)+'</span></div>'
        + '<div class="tl-body">explanation: <b>'+esc(decExplanation)+'</b>'+(dec.explanation_description ? ' — '+esc(dec.explanation_description) : '')+' · confidence '+dec.confidence+' · risk '+dec.risk_score+'<br>decision_path: '+esc(dec.decision_path)+'</div></div></div>';
      body = '<div class="timeline">'+items+'</div>';
    } else if (state.huntMode==='history') {
      var decItems = r.decisions.map(function(d){
        var expl = d.explanation_label || (d.raw_payload && d.raw_payload.explanation) || '';
        return { t:d.timestamp, html:'<div class="tl-item"><div class="tl-card" style="border-color:'+sevBorder(d.state)+';"><div class="tl-head"><span class="tl-type" style="color:'+sevColor(d.state)+'">DECISION — '+d.state+'</span><span class="tl-time">'+fmtTime(d.timestamp)+'</span></div>'
        + '<div class="tl-body">'+(expl ? esc(expl)+' · ' : '')+'confidence '+d.confidence+' · risk '+d.risk_score+' · '+esc(d.decision_path)+'</div></div></div>' }; });
      var evItems = r.evidence.map(function(e){ return { t:e.timestamp, html:'<div class="tl-item"><div class="tl-card"><div class="tl-head"><span class="tl-type" title="'+esc(e.evidence_type)+'">'+esc(e.type_label || e.evidence_type)+'</span><span class="tl-time">'+fmtTime(e.timestamp)+'</span></div>'
        + '<div class="tl-body">'+(e.destination_id !== '(none)' ? 'target: '+esc(e.destination_id)+' · ' : '')+'confidence '+e.confidence+' · source '+esc(e.source)+'</div></div></div>' }; });
      var all = decItems.concat(evItems).sort(function(a,b){ return a.t>b.t?-1:1; }).map(function(x){ return x.html; }).join('');
      body = all ? '<div class="timeline">'+all+'</div>' : '<div class="empty-state">No decisions or evidence for this device in the selected window.</div>';
    } else {
      if (r.outcome === 'no_evidence_available') {
        body = '<div class="empty-state">No supporting evidence available to replay this decision (it predates evidence_ids wiring, or its evidence has aged past retention).</div>';
      } else if (r.outcome === 'replay_error') {
        body = '<div class="error-banner">Replay failed: '+esc(r.error)+'</div>';
      } else {
        var outcomeColor = r.outcome==='changed' ? SEV_HEX.HIGH : SEV_HEX.BENIGN;
        body = '<div class="grid2" style="grid-template-columns:1fr auto 1fr;align-items:center;">'
          + '<div class="panel" style="background:var(--bg-elevated);"><div class="panel-body">'
          + '<div style="font-size:10.5px;color:var(--text-faint);margin-bottom:6px;">ORIGINAL — at decision time</div>'
          + '<div class="pill" style="color:'+sevColor(r.old_state)+';border-color:'+sevBorder(r.old_state)+';background:'+sevBg(r.old_state)+';font-size:14px;padding:6px 12px;">'+r.old_state+'</div>'
          + '<div style="font-size:11.5px;color:var(--text-dim);margin-top:8px;">'+esc(r.old_decision_path)+'</div></div></div>'
          + '<div style="font-size:18px;color:var(--text-faint);">→</div>'
          + '<div class="panel" style="background:var(--bg-elevated);"><div class="panel-body">'
          + '<div style="font-size:10.5px;color:var(--text-faint);margin-bottom:6px;">REPLAYED — against current engine</div>'
          + '<div class="pill" style="color:'+sevColor(r.new_state)+';border-color:'+sevBorder(r.new_state)+';background:'+sevBg(r.new_state)+';font-size:14px;padding:6px 12px;">'+r.new_state+'</div>'
          + '<div style="font-size:11.5px;color:var(--text-dim);margin-top:8px;">'+esc(r.new_decision_path)+'</div></div></div></div>'
          + '<div style="margin-top:14px;padding:10px 13px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;font-size:12px;">'
          + 'outcome: <b style="color:'+outcomeColor+'">'+r.outcome+'</b> — evaluated against '+r.evidence_count+' real evidence item(s)</div>';
      }
    }
    resultsHtml = '<div class="panel"><div class="panel-body">'+body+'</div></div>';
  }

  return ''
    + '<div class="topbar"><div class="view-title">Ad-hoc threat hunt</div><div class="view-sub">Direct structured queries over the evidence graph — not a log grep. Backed by ops/threat_hunt.py and ops/decision_replay.py.</div></div>'
    + '<div class="content"><div class="mode-tabs">'+tabs+'</div><div class="panel" style="margin-bottom:16px;"><div class="panel-body">'+formHtml+'</div></div>'+resultsHtml+'</div>';
}

function renderBlockingView(){
  var topbarHead = topbarWithRefresh('Blocking', 'Everything currently contained by this engine — Fritz!Box WAN isolation, Layer-2 tarpit, and Pi-hole domain blocks — with manual release/unblock, plus a form to block a domain by hand.', 'reloadBlocking', state.blockingLoading);

  if (state.blockingLoadError) {
    return topbarHead + '<div class="content"><div class="error-banner">Could not load blocking state: '+esc(state.blockingLoadError)+'.<br><button class="btn btn-primary btn-sm" onclick="app.reloadBlocking()">Retry</button></div></div>';
  }
  if (state.blockingLoading && !state.blockingLoaded) {
    return topbarHead + '<div class="content"><div class="empty-state">Loading…</div></div>';
  }
  var b = state.blockingState || { contained_devices: [], blocked_domains: [] };

  var sortedDevices = sortRows(b.contained_devices, state.sort.blockDevices, {
    hostname: function(cd){ return cd.hostname; },
    ip: function(cd){ return cd.ip; },
    method: function(cd){ return (cd.tarpitted?1:0) + (cd.router_isolated?1:0); },
  });
  var deviceRows = sortedDevices.length
    ? sortedDevices.map(function(cd){
        var methods = (cd.tarpitted ? '<span class="containment-pill containment-active">Tarpit</span>' : '')
          + (cd.router_isolated ? '<span class="containment-pill containment-active">Fritz!Box</span>' : '');
        return '<tr><td><div class="cell-title">'+esc(cd.hostname)+'</div><div class="cell-mono">'+esc(cd.device_id)+'</div></td>'
          + '<td class="cell-mono">'+esc(cd.ip||'—')+'</td><td>'+methods+'</td>'
          + '<td><button class="btn btn-ghost btn-sm" onclick="app.releaseDevice(\''+esc(cd.device_id)+'\', \''+esc(cd.hostname)+'\')">Release</button> '
          + '<button class="btn btn-ghost btn-sm" onclick="app.selectDevice(\''+esc(cd.device_id)+'\')">Open →</button></td></tr>';
      }).join('')
    : '<tr><td colspan="4"><div class="empty-state">No devices currently contained.</div></td></tr>';

  var sortedDomains = sortRows(b.blocked_domains, state.sort.blockDomains, {
    domain: function(dm){ return dm.domain; },
    hostname: function(dm){ return dm.hostname; },
    reason: function(dm){ return dm.reason; },
    blocked_at: function(dm){ return dm.blocked_at; },
  });
  var domainRows = sortedDomains.length
    ? sortedDomains.map(function(dm){

function statTile(label, value, sinceRestart, captionOverride){
  return '<div style="background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:6px;padding:12px 14px;">'
    + '<div style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;">'+esc(label)+'</div>'
    + '<div class="cell-mono" style="font-size:20px;font-weight:600;color:var(--text);">'+esc(String(value))+'</div>'
    + (captionOverride ? '<div style="font-size:9.5px;color:var(--text-faint);margin-top:2px;">'+esc(captionOverride)+'</div>'
        : sinceRestart ? '<div style="font-size:9.5px;color:var(--text-faint);margin-top:2px;">since restart</div>' : '')
    + '</div>';
}
// 2026-09-16 (user request: clickable Overview dates): renders one stat tile
// that's either day-filtered (a real per-day number exists) or, for the 6
// Prometheus since-restart counters with no per-day history at all, an
// honest "N/A" rather than silently re-showing the whole-window aggregate
// under a day label that would misleadingly imply it's day-scoped.
function statTileDayAware(label, aggregateValue, byDayDict, selectedDay, sinceRestart){
  if (!selectedDay) return statTile(label, fmtCount(aggregateValue), sinceRestart);
  if (byDayDict) return statTile(label, fmtCount(byDayDict[selectedDay] || 0), false, selectedDay);
  return statTile(label, '—', false, 'no daily history (restart counter)');
}
function statGrid(tiles){
  return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;">'+tiles.join('')+'</div>';
}
function fmtCount(n){
  n = Math.round(Number(n) || 0);
  return n.toLocaleString();
}

function alertVolumeBarChart(byDay, selectedDay){
  var days = Object.keys(byDay || {}).sort();
  if (!days.length) return '<div class="empty-state">No alert data available for this window.</div>';
  var maxVal = Math.max.apply(null, days.map(function(d){ return byDay[d]; }));
  var barW = 28, gap = 10, chartH = 120, padTop = 22, padBottom = 22, padLeft = 6;
  var chartW = days.length * (barW + gap) - gap + padLeft * 2;
  // 2026-09-16 (user request: "i want the dates to be clickable so that only
  // values for those days are shown"): each bar+label is wrapped in a <g> with
  // its own click handler (selectOverviewDay toggles the filter, clicking the
  // already-selected day clears it) and a wider, invisible hit-rect so the
  // gap between bars is clickable too, not just the bar itself. The selected
  // bar gets a distinct fill + a highlight ring so it's obvious which day
  // (if any) the panels above are currently scoped to.
  var bars = days.map(function(d, i){
    var val = byDay[d];
    var h = maxVal > 0 ? Math.max(2, (val / maxVal) * chartH) : 2;
    var x = padLeft + i * (barW + gap);
    var y = padTop + (chartH - h);
    var label = d.slice(5); // MM-DD
    var isSelected = d === selectedDay;
    var barFill = 'var(--accent)';
    var barOpacity = isSelected ? '1' : '0.85';
    var ring = isSelected
      ? '<rect x="'+(x-2)+'" y="'+(y-2)+'" width="'+(barW+4)+'" height="'+(h+4)+'" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.5"></rect>'
      : '';
    return '<g class="ov-day-bar" onclick="app.selectOverviewDay(\''+d+'\')" style="cursor:pointer;" role="button" aria-label="Show only '+esc(d)+'">'
      + '<rect x="'+x+'" y="'+padTop+'" width="'+barW+'" height="'+chartH+'" fill="transparent"></rect>'
      + ring
      + '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="2" fill="'+barFill+'" opacity="'+barOpacity+'"></rect>'
      + '<text x="'+(x+barW/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="10" fill="var(--text-dim)" font-family="var(--font-mono)">'+fmtCount(val)+'</text>'
      + '<text x="'+(x+barW/2)+'" y="'+(padTop+chartH+16)+'" text-anchor="middle" font-size="9.5" font-weight="'+(isSelected?'700':'400')+'" fill="'+(isSelected?'var(--text)':'var(--text-faint)')+'" font-family="var(--font-mono)">'+esc(label)+'</text>'
      + '</g>';
  }).join('');
  var baseline = '<line x1="'+padLeft+'" y1="'+(padTop+chartH)+'" x2="'+(chartW-padLeft)+'" y2="'+(padTop+chartH)+'" stroke="var(--border-soft)" stroke-width="1"></line>';
  return '<div style="overflow-x:auto;"><svg width="'+chartW+'" height="'+(padTop+chartH+padBottom)+'" viewBox="0 0 '+chartW+' '+(padTop+chartH+padBottom)+'">'+baseline+bars+'</svg></div>'
    + '<div style="font-size:10.5px;color:var(--text-faint);margin-top:6px;">Click a day to filter the panels above to just that day\'s numbers (where daily history exists). Click it again, or "Clear" above, to go back to the full window.</div>';
}

    + statGrid([

/* ============================= health / heartbeat view ============================= */

var HEALTH_STATE_SEV = {
  healthy:'BENIGN', degraded:'SUSPICIOUS', unhealthy:'HIGH', recovery_failed:'HIGH', safe_mode:'CRITICAL',
  normal:'BENIGN', resource_pressure:'SUSPICIOUS', conservation:'HIGH', critical:'CRITICAL',
  /* 2026-09-15: a job removed from the scheduler entirely (e.g. shadow_watcher,
     gap_monitor) -- neutral gray, distinct from both "healthy" (green) and any
     alert-severity color, since it isn't something to act on. */
  retired:'UNKNOWN'
};
function healthPill(rawState){
  var sevKey = HEALTH_STATE_SEV[rawState] || 'UNKNOWN';
  return '<span class="pill" style="color:'+sevColor(sevKey)+';border-color:'+sevBorder(sevKey)+';background:'+sevBg(sevKey)+'">'
    + '<span class="dot" style="background:'+sevColor(sevKey)+'"></span>'+esc(rawState || 'unknown')+'</span>';
}
function agoText(ts){
  if (ts == null) return '—';
  var s = Math.max(0, (Date.now()/1000) - ts);
  if (s < 90) return Math.floor(s) + 's ago';
  if (s < 5400) return Math.floor(s/60) + 'm ago';
  if (s < 129600) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
var COMPONENT_LABELS = {
  pipeline_main_loop: 'Pipeline main loop', identity_reconcile_worker: 'Identity reconcile worker',
  ti_refresh: 'Threat-intel refresh', api_subprocess: 'Console / API subprocess',
  scheduler_subprocess: 'Job scheduler subprocess', zeek: 'Zeek', suricata: 'Suricata', pihole: 'Pi-hole',
  /* 2026-09-15: distinct from "suricata"/"pihole" above on purpose -- those only
     check binary presence / connectivity, these show whether a scan/poll actually
     completed recently. Keeping both visible (not merged) so one can't hide the
     other. */
  suricata_scan: 'Suricata (last scan)', pihole_poll: 'Pi-hole (last poll)',
  backtest_job: 'Nightly backtest job'
};
var COMPONENT_ORDER = ['pipeline_main_loop','identity_reconcile_worker','ti_refresh','api_subprocess','scheduler_subprocess','zeek','suricata','suricata_scan','pihole','pihole_poll','backtest_job'];
function componentLabel(name){
  if (COMPONENT_LABELS[name]) return COMPONENT_LABELS[name];
  if (name.indexOf('feed:') === 0) return name.slice(5) + ' (feed)';
  if (name.indexOf('job:') === 0) return name.slice(4) + ' (job)';
  return name;
}

function renderHealthView(){
  var topbarHead = topbarWithRefresh('Health', 'Live watchdog status from core/health_manager.py — component heartbeats, resource-pressure level, and auto-recovery state. Written once per check cycle by the main engine process; this page reads that snapshot, it isn\'t computing anything itself.', 'reloadHealth', state.healthLoading);

  if (state.healthLoadError) {
    return topbarHead + '<div class="content"><div class="error-banner">Could not load health status: '+esc(state.healthLoadError)+'.<br><button class="btn btn-primary btn-sm" onclick="app.reloadHealth()">Retry</button></div></div>';
  }
  if (state.healthLoading && !state.healthLoaded) {
    return topbarHead + '<div class="content"><div class="empty-state">Loading health status…</div></div>';
  }

  var d = state.healthData || {};
  var snap = d.snapshot || {};
  var heartbeats = d.component_heartbeats || {};
  var jobs = d.job_health || {};
  var feeds = d.feed_health || {};
  var hasSnapshot = snap && snap.written_at != null;

  var summaryPanel;
  if (!hasSnapshot) {
    summaryPanel = '<div class="panel" style="margin-bottom:16px;"><div class="panel-body"><div class="empty-state">'
      + (d.health_manager_enabled ? 'No snapshot yet — the health manager writes one per check cycle, first one lands shortly after the engine boots.' : 'health_manager_enabled is false — the whole subsystem is off.')
      + '</div></div></div>';
  } else {
    var snapAgeSec = (Date.now()/1000) - snap.written_at;
    var staleWarning = snapAgeSec > 120
      ? '<div style="color:'+sevColor('CRITICAL')+';font-size:12px;margin-top:8px;">⚠️ Snapshot is '+agoText(snap.written_at)+' old (expected every ~15-30s) — the health manager thread may have stopped.</div>'
      : '';
    summaryPanel = '<div class="panel" style="margin-bottom:16px;"><div class="panel-header"><div class="panel-title">Resource pressure</div></div>'
      + '<div class="panel-body">'
      + '<div class="kv-row"><div class="kv-key">level</div><div class="kv-val">'+healthPill(snap.pressure_level)+'</div></div>'
      + '<div class="kv-row"><div class="kv-key">main process RSS</div><div class="kv-val cell-mono">'+(snap.rss_mb!=null ? snap.rss_mb.toFixed(0)+' MB' : '—')+'</div></div>'
      + '<div class="kv-row"><div class="kv-key">auto-recovery</div><div class="kv-val">'+(snap.auto_recovery_enabled ? '<span class="tag">enabled</span>' : '<span class="tag">alert-only</span>')+'</div></div>'
      + '<div class="kv-row"><div class="kv-key">snapshot age</div><div class="kv-val cell-mono">'+agoText(snap.written_at)+'</div></div>'
      + staleWarning
      + '</div></div>';
  }

  var compEntries = snap.components || {};
  var compNames = Object.keys(compEntries);
  compNames.sort(function(a, b){
    var ia = COMPONENT_ORDER.indexOf(a), ib = COMPONENT_ORDER.indexOf(b);
    if (ia === -1) ia = 999; if (ib === -1) ib = 999;
    if (ia !== ib) return ia - ib;
    return a < b ? -1 : (a > b ? 1 : 0);
  });
  var compRows = compNames.length
    ? compNames.map(function(name){
        var c = compEntries[name];
        var hb = heartbeats[name]; // extra fields (pid) for api_subprocess/scheduler_subprocess, if present
        var extra = hb && hb.pid ? ' <span style="color:var(--text-faint);font-size:11px;">pid '+esc(String(hb.pid))+'</span>' : '';
        return '<tr><td><div class="cell-title">'+esc(componentLabel(name))+extra+'</div><div class="cell-mono" style="font-size:11px;">'+esc(name)+'</div></td>'
          + '<td>'+healthPill(c.state)+'</td>'
          + '<td style="font-size:11.5px;color:var(--text-dim);">'+esc(c.detail||'')+'</td>'
          + '<td class="cell-mono">'+(c.recovery_attempts||0)+'</td>'
          + '<td class="cell-mono">'+agoText(c.last_updated)+'</td></tr>';
      }).join('')
    : '<tr><td colspan="5"><div class="empty-state">No components tracked yet.</div></td></tr>';

  var jobNames = Object.keys(jobs).sort();
  var jobRows = jobNames.length
    ? jobNames.map(function(name){
        var j = jobs[name];
        return '<tr><td class="cell-mono">'+esc(name)+'</td><td class="cell-mono">'+agoText(j.last_success)+'</td>'
          + '<td class="cell-mono">'+(j.duration_seconds!=null ? j.duration_seconds.toFixed(1)+'s' : '—')+'</td></tr>';
      }).join('')
    : '<tr><td colspan="3"><div class="empty-state">No scheduled-job telemetry yet.</div></td></tr>';

  var feedNames = Object.keys(feeds).sort();
  var feedRows = feedNames.length
    ? feedNames.map(function(name){
        var f = feeds[name];
        var failures = f.consecutive_failures || 0;
        var state_ = failures === 0 ? 'healthy' : (f.category === 'auth_expired' ? 'unhealthy' : 'degraded');
        return '<tr><td class="cell-mono">'+esc(name)+'</td><td>'+healthPill(state_)+'</td>'

          + '<td style="font-size:11.5px;color:var(--text-dim);">'+esc(f.last_error||'')+'</td></tr>';
      }).join('')
    : '<tr><td colspan="4"><div class="empty-state">No threat-intel feed telemetry yet.</div></td></tr>';

  return topbarHead + '<div class="content">'
    + summaryPanel
    + '<div class="panel" style="margin-bottom:16px;"><div class="panel-header"><div class="panel-title">Components</div></div>'
    + '<div class="table-wrap"><table><thead><tr><th>Component</th><th>State</th><th>Detail</th><th>Recovery attempts</th><th>Updated</th></tr></thead><tbody>'+compRows+'</tbody></table></div></div>'
    + '<div class="panel" style="margin-bottom:16px;"><div class="panel-header"><div class="panel-title">Scheduled jobs</div></div>'
    + '<div class="table-wrap"><table><thead><tr><th>Job</th><th>Last success</th><th>Duration</th></tr></thead><tbody>'+jobRows+'</tbody></table></div></div>'
    + '<div class="panel"><div class="panel-header"><div class="panel-title">Threat-intel feeds</div></div>'
    + '<div class="table-wrap"><table><thead><tr><th>Feed</th><th>State</th><th>Consecutive failures</th><th>Last error</th></tr></thead><tbody>'+feedRows+'</tbody></table></div></div>'
    + '</div>';
}

/* ============================= autonomy view (autotuner + composite trust) ========= */
/* 2026-09-15, console/health audit -- user's own framing: "it should be clear what has
   happened and how it is tuned up or down." Both event logs (threshold_history, the
   graph's own 'trusts' edges) already existed with complete, self-explaining history;
   this is the first console surface for either. */

var AUTOTUNE_DIRECTION_STYLE = {
  tightened: { label: '▲ Tightened', color: SEV_HEX.ANOMALOUS },
  loosened: { label: '▼ Loosened', color: SEV_HEX.SUSPICIOUS },
  unchanged: { label: '— Unchanged', color: SEV_HEX.UNKNOWN },
};
var AUTOTUNE_STATUS_STYLE = {
  promoted: { label: 'Promoted', color: SEV_HEX.BENIGN },
  pending_canary: { label: 'Pending canary', color: SEV_HEX.ANOMALOUS },
  rolled_back: { label: 'Rolled back', color: SEV_HEX.HIGH },
};
function directionBadge(direction){
  var s = AUTOTUNE_DIRECTION_STYLE[direction] || { label: direction, color: SEV_HEX.UNKNOWN };
  return '<span class="pill" style="color:'+s.color+';border-color:'+hexA(s.color,0.45)+';background:'+hexA(s.color,0.12)+'">'+esc(s.label)+'</span>';
}
function statusBadge(status){
  var s = AUTOTUNE_STATUS_STYLE[status] || { label: status, color: SEV_HEX.UNKNOWN };
  return '<span class="pill" style="color:'+s.color+';border-color:'+hexA(s.color,0.45)+';background:'+hexA(s.color,0.12)+'">'+esc(s.label)+'</span>';
}
function fmtParamValue(v){ return (v == null) ? '—' : (Math.round(v*1000)/1000); }

// 2026-09-28 (console audit, user request: "update the console with all 16
// autotune parameter"): the Autotuner Timeline panel below only ever shows a
// parameter that HAS a proposal in threshold_history -- a quiet parameter
// nothing has ever triggered a change for (e.g. combined_uncertain_threshold
// on a quiet network) was invisible even though it's live and tunable. This
// panel lists all 16 from /api/autonomy/parameters unconditionally: current
// (global-tier) value, shipped default, and bounds, regardless of history.
function renderAutonomyParamsPanel(){
  var headerRight = '<button class="btn btn-sm" onclick="app.reloadAutonomyParams()" '+(state.autonomyParamsLoading?'disabled':'')+'>'+(state.autonomyParamsLoading?'Loading…':'Refresh')+'</button>';
  var header = '<div class="panel-header"><div class="panel-title">Tunable parameters (all 16)</div>'+headerRight+'</div>';

  if (state.autonomyParamsLoadError) {
    return '<div class="panel" style="margin-bottom:16px;">'+header+'<div class="panel-body"><div class="error-banner">Could not load tunable-parameter data: '+esc(state.autonomyParamsLoadError)+'.</div></div></div>';
  }
  if (state.autonomyParamsLoading && !state.autonomyParamsLoaded) {
    return '<div class="panel" style="margin-bottom:16px;">'+header+'<div class="panel-body"><div class="empty-state">Loading tunable parameters…</div></div></div>';
  }

  var params = (state.autonomyParamsData || {}).parameters || [];
  var rows = params.length
    ? params.map(function(p){
        var b = p.bounds || {};
        var stepText = (b.max_step != null)
          ? ('±'+fmtParamValue(b.max_step))
          : ('+'+fmtParamValue(b.max_step_up)+' / -'+fmtParamValue(b.max_step_down));
        var boundsText = fmtParamValue(b.min)+' – '+fmtParamValue(b.max)+' (step '+stepText+')';
        var tunedBadge = p.is_at_default
          ? '<span class="pill" style="color:'+SEV_HEX.UNKNOWN+';border-color:'+hexA(SEV_HEX.UNKNOWN,0.45)+';background:'+hexA(SEV_HEX.UNKNOWN,0.12)+'">At default</span>'
          : '<span class="pill" style="color:'+SEV_HEX.ANOMALOUS+';border-color:'+hexA(SEV_HEX.ANOMALOUS,0.45)+';background:'+hexA(SEV_HEX.ANOMALOUS,0.12)+'">Tuned</span>';
        return '<tr><td class="cell-mono">'+esc(p.parameter)+'</td>'
          + '<td class="cell-mono">'+fmtParamValue(p.current_value)+'</td>'
          + '<td class="cell-mono" style="color:var(--text-faint);">'+fmtParamValue(p.default_value)+'</td>'
          + '<td class="cell-mono" style="font-size:11px;color:var(--text-dim);">'+esc(boundsText)+'</td>'
          + '<td>'+tunedBadge+'</td></tr>';
      }).join('')
    : '<tr><td colspan="5"><div class="empty-state">No tunable-parameter data.</div></td></tr>';

  return '<div class="panel" style="margin-bottom:16px;">'+header
    + '<div style="padding:10px 16px 0;font-size:10.5px;color:var(--text-faint);">Every parameter the closed-loop autotuner is allowed to touch, whether or not it has ever actually proposed a change for it yet -- "Current" is the global-tier active value (device/category overrides, shown below, can differ). "Tuned" means it has drifted from its shipped default at the global tier.</div>'
    + '<div class="table-wrap"><table><thead><tr><th>Parameter</th><th>Current</th><th>Shipped default</th><th>Bounds</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderGraphView(){
  var topbarHead = topbarWithRefresh('Evidence graph', 'Most recent 25 decisions and everything connected to them — devices → evidence → destinations, evidence → decisions → alerts (orange nodes: fired/suppressed/logged-only). Repeated same-type evidence against the same device/destination is shown as one node with a "×N" count instead of N separate timestamped copies (click it for first-seen/most-recent). Drag any node to rearrange it; shift-click nodes (or shift-drag a box over several) to select a group and drag any of them to move the whole group together; drag the background (or press Esc) to deselect/pan, scroll to zoom, click a node to inspect it. A single busy decision\'s evidence and alerts are each capped per-decision (see the drawer for "N of TOTAL" when truncated).', 'reloadGraph', state.graphLoading);

  if (state.graphLoadError) {
    return topbarHead + '<div class="content"><div class="error-banner">Could not load the graph: '+esc(state.graphLoadError)+'.<br><button class="btn btn-primary btn-sm" onclick="app.reloadGraph()">Retry</button></div></div>';
  }
  if (state.graphLoading && !state.graphLoaded) {
    return topbarHead + '<div class="content"><div class="empty-state">Loading the evidence graph…</div></div>';
  }
  if (state.graphLoaded && !state.graphNodes.length) {
    return topbarHead + '<div class="content"><div class="empty-state">No decisions in the graph yet.</div></div>';
  }

  var visibleNodes = state.graphNodes.filter(function(n){ return state.graphShow[n.kind]; });
  var visibleIds = {}; visibleNodes.forEach(function(n){ visibleIds[n.id]=true; });
  var visibleEdges = state.graphEdges.filter(function(e){ return visibleIds[e.from] && visibleIds[e.to]; });
  var byId = state.graphNodeById || {};

  // Multi-hop highlight (2026-09-22, user request: "when clicking a node all
  // connected node end to end should get selected or highlighted" -- was
  // only ever 1-hop before, so clicking a decision highlighted its direct
  // evidence/alert but NOT that evidence's own device, or the alert's own
  // explanation node two hops away). BFS over the FULL edge set (not just
  // visibleEdges) so toggling a kind off in the legend doesn't break the
  // traversal chain for kinds still shown on either side of it.
  var connectedSet = null;
  if (state.graphSelected) {
    connectedSet = {};
    var adjacency = {};
    state.graphEdges.forEach(function(e){
      (adjacency[e.from] || (adjacency[e.from] = [])).push(e.to);
      (adjacency[e.to] || (adjacency[e.to] = [])).push(e.from);
    });
    var queue = [state.graphSelected];
    connectedSet[state.graphSelected] = true;
    while (queue.length) {
      var cur = queue.shift();
      (adjacency[cur] || []).forEach(function(next){
        if (!connectedSet[next]) { connectedSet[next] = true; queue.push(next); }
      });
    }
  }

  var edgesSvg = visibleEdges.map(function(e){
    var a = byId[e.from], b = byId[e.to];
    if (!a || !b) return '';
    var touches = !connectedSet || connectedSet[e.from] || connectedSet[e.to];
    return '<line data-edge-from="'+e.from+'" data-edge-to="'+e.to+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+e.stroke+'" stroke-width="'+(touches?1.6:1)+'" opacity="'+(touches?0.9:0.12)+'" stroke-dasharray="'+(e.dash||'')+'"></line>';
  }).join('');
  var nodesSvg = visibleNodes.map(function(n){
    var connected = !connectedSet || !!connectedSet[n.id];
    var sw = n.id===state.graphSelected ? 3 : 1;
    var label = n.kind === 'evidence' ? (n.type_label || n.label) + (n.count ? ' ×'+n.count : '') : (n.label && n.label.length > 26 ? n.label.slice(0,24)+'…' : n.label);
    var multiSel = !!state.graphMultiSelected[n.id];
    var ring = multiSel ? '<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(n.r+5)+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3,2"></circle>' : '';
    return '<g class="node-group'+(multiSel?' multi-selected':'')+'" data-node-id="'+n.id+'" style="opacity:'+(connected?1:0.22)+';">'
      + ring
      + '<circle cx="'+n.x+'" cy="'+n.y+'" r="'+n.r+'" fill="'+n.fill+'" stroke="'+n.stroke+'" stroke-width="'+sw+'"></circle>'
      + '<text class="node-label" x="'+(n.x+n.r+6)+'" y="'+(n.y+3)+'">'+esc(label)+'</text>'
      + '<text class="node-sub" x="'+(n.x+n.r+6)+'" y="'+(n.y+14)+'">'+esc(n.sub||'')+'</text></g>';
  }).join('');

  var legend = GRAPH_LEGEND_DEFS.map(function(l){
    var bg = state.graphShow[l.kind] ? l.bg : 'transparent';
    return '<div class="legend-row" onclick="app.toggleGraphKind(\''+l.kind+'\')"><div class="legend-check" style="background:'+bg+';border-color:'+l.color+';"></div><span style="color:var(--text-dim);">'+l.label+'</span></div>';
  }).join('');
  var selCount = Object.keys(state.graphMultiSelected).length;
  var zoomControls = '<div class="graph-legend" style="left:auto;right:12px;top:12px;flex-direction:row;gap:6px;padding:6px 8px;align-items:center;">'
    + (selCount ? '<span style="font-size:11px;color:var(--text-dim);white-space:nowrap;">'+selCount+' selected</span><button class="btn btn-ghost btn-sm" onclick="app.graphClearSelection()">Clear</button>' : '')
    + '<button class="icon-btn" title="zoom in" onclick="app.graphZoomBy(1.2)">+</button>'
    + '<button class="icon-btn" title="zoom out" onclick="app.graphZoomBy(0.8)">−</button>'
    + '<button class="icon-btn" title="fit to view" onclick="app.graphFitToView()">⛶</button>'
    + '<button class="icon-btn" title="reset zoom" onclick="app.graphResetView()">⟲</button></div>';

  var drawer;
  if (state.graphSelected && byId[state.graphSelected]) {
    var n = byId[state.graphSelected];
    var fields = [];
    if (n.kind==='device') {
      fields = [['device_id', n.sub], ['hostname', n.label]];
    } else if (n.kind==='evidence') {
      fields = [['what happened', (n.type_label || n.label) + (n.type_description ? ' — ' + n.type_description : '')],
                ['raw type', n.label], ['family',n.sub],['confidence',n.confidence],['source',n.source]];
      if (n.count) {
        fields.push(['occurrences', n.count + ' — compressed from ' + n.count + ' near-identical entries (same device/type/family/destination)']);
        fields.push(['first seen', fmtTime(n.first_timestamp)]);
        fields.push(['most recent', fmtTime(n.timestamp)]);
      } else {
        fields.push(['timestamp', fmtTime(n.timestamp)]);
      }
    } else if (n.kind==='destination') {
      // Humanize (2026-09-22, user request): label is the resolved hostname/
      // domain when one exists; the raw destination_id/ASN/country stay
      // visible underneath rather than being lost once resolved.
      fields = [['kind', n.resolved_kind === 'local_device' ? 'device on your network' : n.resolved_kind || n.sub], ['label', n.label]];
      if (n.destination_id && n.destination_id !== n.label) fields.push(['raw address', n.destination_id]);
      if (n.asn_owner) fields.push(['operated by', n.asn_owner]);
      if (n.country) fields.push(['country', n.country]);
    } else if (n.kind==='explanation') {
      fields = [['explanation', n.full_text || n.label], ['timestamp', fmtTime(n.timestamp)]];
    } else if (n.kind==='alert_event') {
      // Plain-English narrative (2026-09-22, user request) leads; the raw
      // hypothesis code stays available underneath as 'signature', same
      // "readable first, technical secondary" ordering as the alerts table.
      fields = [['status', n.label]];
      if (n.plain_explanation) fields.push(['explanation', n.plain_explanation]);
      fields.push(['signature', n.sub || '—'],
                ['fp_verdict', n.fp_verdict||'—'],
                ['fp_confidence', n.fp_confidence!=null ? Number(n.fp_confidence).toFixed(3) : '—'],
                ['incident_id', n.incident_id || '—'],
                ['timestamp', fmtTime(n.timestamp)]);
    } else {
      var explanation = n.winning_hypothesis_label
        ? n.winning_hypothesis_label + (n.winning_hypothesis_description ? ' — ' + n.winning_hypothesis_description : '')
        : (n.winning_hypothesis || '—');
      fields = [['state',n.label],['decision_id',n.sub],['risk_score',n.risk_score],['confidence',n.confidence],
                ['timestamp', fmtTime(n.timestamp)],['explanation', explanation],
                ['evidence shown', n.evidence_truncated ? ('capped — showing recent subset of ' + n.evidence_total) : (n.evidence_total || 0)]];
    }
    var kvRows = fields.map(function(f){ return '<div class="kv-row"><div class="kv-key">'+f[0]+'</div><div class="kv-val cell-mono">'+esc(String(f[1]))+'</div></div>'; }).join('');
    drawer = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'
      + '<div><div style="font-size:10.5px;color:var(--text-faint);margin-bottom:2px;">'+n.kind.toUpperCase()+'</div><div style="font-size:14px;font-weight:600;">'+esc(n.type_label || n.label)+'</div></div>'
      + '<button class="icon-btn" title="Close" onclick="app.deselectGraphNode()" style="flex:0 0 auto;">'+ICONS.close+'</button>'
      + '</div><div style="margin-bottom:12px;"></div>'+kvRows;
  } else {
    drawer = '<div class="empty-state">Click a node to inspect its fields.</div>';
  }

  var transform = 'translate('+state.graphPan.x+','+state.graphPan.y+') scale('+state.graphZoom+')';
  return topbarHead
    + '<div class="content"><div class="graph-wrap"><div class="graph-canvas" id="graphCanvas"><div class="graph-legend">'+legend+'</div>'+zoomControls
    + '<svg id="graphSvg" width="100%" height="100%" style="display:block;"><g id="graphViewport" transform="'+transform+'">'+edgesSvg+nodesSvg+'</g></svg></div>'
    + '<div class="graph-drawer">'+drawer+'</div></div></div>';
}

function alertStatusPill(status){

    FIRED: ['#e0743f','rgba(224,116,63,.3)','#e0743f'],

function renderGraphTab(){
